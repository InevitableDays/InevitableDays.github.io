<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Offline PDF Archive</title>

  <style>
    :root{
      --line: rgba(0,0,0,0.75);
      --glass: rgba(255,255,255,0.06);
      --glass2: rgba(255,255,255,0.08);
    }

    *{ box-sizing: border-box; }

    html, body{
      height: 100%;
      overflow: hidden;
    }

    body{
      margin:0;
      font-family: Arial, sans-serif;
      color:#e9eef7;
      background: url("y123.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    header{
      background: rgba(15,17,21,0.55);
      padding: 16px 24px;
      border-bottom: 1px solid rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
      z-index: 20;
      position: relative;
    }

    .topbar{
      width: 100%;
      display:flex;
      gap: 12px;
      align-items:center;
      justify-content: space-between;
    }

    h1{
      font-size: 18px;
      margin: 0;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: font-size 0.2s ease;
    }

    .searchWrap{
      flex: 1;
      display:flex;
      justify-content: center;
      align-items:center;
      padding: 0 12px;
      transition: all 0.2s ease;
    }

    input[type="search"]{
      width: min(650px, 100%);
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.08);
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    input[type="search"]::placeholder{
      color: rgba(233,238,247,0.55);
    }

    main{
      height: calc(100vh - 70px);
      display:grid;
      grid-template-columns: 520px 1fr;
      gap: 12px;
      padding: 16px 24px;
      width: 100%;
      margin: 0;
      transition: all 0.2s ease;
    }

    .left{
      border-radius: 18px;
      background: rgba(20,22,28,0.62);
      border: 1px solid var(--line);
      height: 100%;
      overflow-y: auto;
      padding: 12px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .card{
      border-radius: 18px;
      overflow:hidden;
      background: rgba(20,22,28,0.96);
      border: 1px solid var(--line);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover{
      transform: translateY(-3px);
      box-shadow:
        0 18px 40px rgba(0, 200, 0, 0.45),
        0 0 18px rgba(0, 180, 255, 0.55);
    }

    .cover {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      color: #FF0000;
      font-weight: 900;
      letter-spacing: 1px;
      user-select: none;
      border-bottom: 1px solid var(--line);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .content{
      padding: 10px;
    }

    .title{
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      margin: 0 0 8px;
      min-height: 32px;
    }

    .tags{
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag{
      font-size: 11px;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--line);
      opacity: 0.9;
    }

    .right{
      border-radius: 18px;
      border: 1px solid var(--line);
      overflow:hidden;
      display:flex;
      flex-direction: column;
      height: 100%;
      background: transparent;
      transition: all 0.2s ease;
    }

    .right.isEmpty{
      background: rgba(255,255,255,0.00);
    }

    .right.isLoaded{
      background: #000;
    }

    .viewerTop{
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 10px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .viewerTitle{
      font-size: 13px;
      font-weight: 800;
      opacity: 0.95;
      overflow:hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .toggleBtn{
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor:pointer;
      font-weight: 800;
      font-size: 12px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .toggleBtn:hover{
      background: rgba(255,255,255,0.14);
    }

    .viewerArea{
      flex: 1;
      overflow: auto;
      background: transparent;
      position: relative;
    }

    embed{
      width: 100%;
      height: 100%;
      border: 0;
      display:block;
      background: transparent;
    }

    .placeholder{
      position: absolute;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding: 20px;
      opacity: 0.85;
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      pointer-events: none;
    }

    /* Fullscreen reading mode */
    main.hideLibrary{
      display: block;
      padding: 0;
    }

    main.hideLibrary .left{
      display: none;
    }

/* Adjust PDF reading window slightly below topbar */
main.hideLibrary .right{
    position: fixed;
    top: 20px;              /* pull down below header */
    left: 0;
    width: 100vw;
    height: calc(110vh - 20px);  /* reduce height accordingly */
    border-radius: 0;
    z-index: 10;
}

    main.hideLibrary header{
      height: 40px;
      padding: 4px 24px;
    }

    main.hideLibrary #homeTitle{
      font-size: 16px;
    }

    main.hideLibrary .searchWrap{
      display: none;
    }

    main.hideLibrary embed{
      width: 99vw;
      height: calc(100vh - 50px);
    }

    @media (max-width: 900px){
      main{
        grid-template-columns: 1fr;
      }
      .left{
        display:block;
      }
      main.hideLibrary .left{
        display:none;
      }
    }

/* let me override this shit for mobile */
/* Make header wrap on small screens */
.topbar, .searchWrap {
  flex-wrap: wrap;
}

.searchWrap {
  justify-content: flex-start;
  gap: 8px;
  padding: 8px 0;
}

/* Touch-friendly buttons */
.toggleBtn {
  padding: 10px 14px;
  font-size: 14px;
}

/* Grid cards for mobile */
@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
  }

  input[type="search"] {
    width: 100%;
    padding: 10px;
    font-size: 14px;
  }

  .viewerTop {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }

  .viewerTitle {
    font-size: 14px;
  }

  .toggleBtn {
    width: 100%;
    text-align: center;
  }

  main.hideLibrary .right {
    top: 0;
    height: 100vh;
  }
}

 </style>
</head>

<body>
<header>
  <div class="topbar">
    <h1 id="homeTitle">📚 My Offline PDF Archive</h1>

    <div class="searchWrap">
      <input
        id="search"
        type="search"
        placeholder="Search title or tags... (press Enter to open first match)"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        autofocus
        spellcheck="false"
      />
      <button id="randomBtn" class="toggleBtn" style="margin-left: 8px;">🎲 Random PDF</button>
<button id="refreshBtn" class="toggleBtn" style="margin-left: 8px;">🔄 Refresh Library</button>

    </div>
  </div>
</header>

<main id="layout">
  <div class="left">
    <div id="grid" class="grid"></div>
  </div>

  <div class="right isEmpty" id="rightPanel">
    <div class="viewerTop">
      <div id="viewerTitle" class="viewerTitle">Select a PDF to view</div>
      <button id="toggleLibrary" class="toggleBtn">Reader Mode</button>
    </div>
    <div class="viewerArea" id="viewerArea">
      <div class="placeholder" id="placeholder">👈 Click a PDF on the left to load it here.</div>
    </div>
  </div>
</main>

<script>
  /* JS code stays mostly the same */
const library = [];
const grid = document.getElementById("grid");
const viewer = document.getElementById("viewer");
const viewerTitle = document.getElementById("viewerTitle");

// Replace <username> and <repo> with your GitHub info
const repoApi = 'https://api.github.com/repos/<username>/pdf-archive/contents/pdfs';

async function loadLibrary() {
  grid.innerHTML = '';
  const res = await fetch(repoApi);
  const files = await res.json();

  files
    .filter(f => f.name.endsWith('.pdf'))
    .forEach(f => {
      const item = {
        title: f.name.replace('.pdf', ''),
        file: f.download_url,
        tags: []
      };
      library.push(item);

      // Make card
      const card = makeCard(item);
      grid.appendChild(card);
    });
}

// Call this instead of render(library)
loadLibrary();

  const layout = document.getElementById("layout");
  const grid = document.getElementById("grid");
  const searchInput = document.getElementById("search");
  const viewerTitle = document.getElementById("viewerTitle");
  const viewerArea = document.getElementById("viewerArea");
  const placeholder = document.getElementById("placeholder");
  const toggleLibraryBtn = document.getElementById("toggleLibrary");
  const rightPanel = document.getElementById("rightPanel");
  const homeTitle = document.getElementById("homeTitle");
  const randomBtn = document.getElementById("randomBtn");

    homeTitle.addEventListener("click", () => {
    window.location.href = window.location.href; // reland current page
    }); 

  function loadPDF(item){
    viewerTitle.textContent = item.title;
    viewerArea.innerHTML = "";
    viewerArea.appendChild(placeholder);
    const embed = document.createElement("embed");
    const zoom = layout.classList.contains("hideLibrary") ? 120 : 100;
    embed.src = item.file + "#zoom=" + zoom;
    embed.type = "application/pdf";
    viewerArea.appendChild(embed);
    rightPanel.classList.remove("isEmpty");
    rightPanel.classList.add("isLoaded");
    placeholder.style.display = "none";
  }

  function makeCard(item){
    const card = document.createElement("div");
    card.className = "card";
    card.addEventListener("click", () => loadPDF(item));
    const cover = document.createElement("div");
    cover.className = "cover";
    cover.textContent = "PDF";
    const img = document.createElement("img");
    img.src = "pdf-icon.jpg";
    img.style.width = "60px";
    img.style.height = "60px";
    img.style.objectFit = "contain";
    cover.appendChild(img);
    const content = document.createElement("div");
    content.className = "content";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = item.title;
    const tags = document.createElement("div");
    tags.className = "tags";
    (item.tags||[]).forEach(t => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = t;
      tags.appendChild(tag);
    });
    content.appendChild(title);
    content.appendChild(tags);
    card.appendChild(cover);
    card.appendChild(content);
    return card;
  }

  function filterLibrary(query){
    query = query.trim().toLowerCase();
    if(!query) return library;
    return library.filter(item => {
      const titleMatch = (item.title||"").toLowerCase().includes(query);
      const tagMatch = (item.tags||[]).join(" ").toLowerCase().includes(query);
      return titleMatch || tagMatch;
    });
  }

  function render(list){
    grid.innerHTML = "";
    list.forEach(item => grid.appendChild(makeCard(item)));
  }

  render(library);

  searchInput.addEventListener("input", () => {
    if(layout.classList.contains("hideLibrary") && searchInput.value.trim() !== ""){
      layout.classList.remove("hideLibrary");
      toggleLibraryBtn.textContent = "Reader Mode";
    }
    render(filterLibrary(searchInput.value));
  });

  searchInput.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      e.preventDefault();
      const results = filterLibrary(searchInput.value);
      if(results.length>0){
        loadPDF(results[0]);
        layout.classList.add("hideLibrary");
        toggleLibraryBtn.textContent = "Show Library";
      }
    }
  });

  toggleLibraryBtn.addEventListener("click", () => {
    layout.classList.toggle("hideLibrary");
    toggleLibraryBtn.textContent = layout.classList.contains("hideLibrary")?"Show Library":"Reader Mode";
  });

  homeTitle.addEventListener("click", () => {
    searchInput.value="";
    render(library);
    layout.classList.remove("hideLibrary");
    toggleLibraryBtn.textContent = "Reader Mode";
    viewerTitle.textContent="Select a PDF to view";
    viewerArea.innerHTML="";
    placeholder.style.display="flex";
    viewerArea.appendChild(placeholder);
    rightPanel.classList.add("isEmpty");
    rightPanel.classList.remove("isLoaded");
  });

  rightPanel.classList.add("isEmpty");
  rightPanel.classList.remove("isLoaded");

  randomBtn.addEventListener("click", () => {
    if(library.length===0) return;
    const randomIndex=Math.floor(Math.random()*library.length);
    const randomPDF = library[randomIndex];
    if(layout.classList.contains("hideLibrary")){
      layout.classList.remove("hideLibrary");
      toggleLibraryBtn.textContent="Reader Mode";
    }
    loadPDF(randomPDF);
  });


document.getElementById("randomBtn").addEventListener("click", async () => {  //reflesher
  if(library.length === 0) await loadLibrary();
  const randomPDF = library[Math.floor(Math.random()*library.length)];
  loadPDF(randomPDF);
});

</script>

<button onclick="window.location.href='https://inevitabledays.github.io/'"
        style="
          position: fixed;
          top: 9px;               /* distance from top */
          left: 77%;              /* center horizontally */
          transform: translateX(-50%);  /* adjust exact center */
          width: 32px;
          height: 32px;
          padding: 0;
          border: none;
          background: transparent;
          cursor: pointer;
          z-index: 9999;">
  <img src="home.png" title="Home" alt="Home" width="32" height="32" style="display:block;">
<style>
/* Hover effect for all buttons that contain home.png */
button img[src="home.png"] {
  transition: transform 0.2s ease, filter 0.2s ease;
}

button img[src="home.png"]:hover {
  transform: scale(1.2);       /* slightly bigger on hover */
  filter: brightness(1.1);     /* brighten a little */
}
</style>
</button>

</body>
</html>
