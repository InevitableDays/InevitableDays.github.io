<style>
/* Page background */
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 20px;
    box-sizing: border-box;
    overflow: auto;
    overscroll-behavior-y: auto;

    transition: background 0.5s ease;

    background:
/*         linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), */
        url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1600");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed; /* smoother look on most devices */
}

/* Better mobile background fit */
@media (max-width: 900px) {
    body {
        background-size: cover;
        background-position: center center;
        background-attachment: scroll; /* prevents mobile lag */
    }
}

/* App container (glass effect) */
#app {
    width: 320px;
    max-width: 90vw;

    background: rgba(255, 255, 255, 0.25); /* transparent, pick one later you have override now #app */
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

    text-align: center;
}
</style>
</head>

<body id="body">
 <!-- Main Timer Container -->
<div id="app"
     style="
        background: rgba(255, 228, 200, 0.27);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.20);
        text-align: center;
        width: 320px;
        max-width: 90vw;
     ">


    <h2 id="appTitle" style="margin-bottom:20px; cursor: pointer; color:#333;">Countdown Timer</h2>
    
    <div id="display" style="font-size:48px; font-weight:bold; margin-bottom:25px; color:#222;">
        00:00:00
    </div>
    </div>
    <pre> </pre>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <button id="btn2h" onclick="startTimer(7200, '2hours')" style="padding:10px; border:none; border-radius:8px; background:#4CAF50; color:white; cursor:pointer;">2 Hours</button>
        <button id="btn1h" onclick="startTimer(3600, 'mountain')" style="padding:10px; border:none; border-radius:8px; background:#4CAF50; color:white; cursor:pointer;">1 Hour</button>
        <button id="btn30" onclick="startTimer(1800, 'ocean')" style="padding:10px; border:none; border-radius:8px; background:#2196F3; color:white; cursor:pointer;">30 Mins</button>
        <button id="btn20" onclick="startTimer(1200, 'forest')" style="padding:10px; border:none; border-radius:8px; background:#FF9800; color:white; cursor:pointer;">20 Mins</button>
        <button id="btn15" onclick="startTimer(900, '15mins')" style="padding:10px; border:none; border-radius:8px; background:#f44336; color:white; cursor:pointer;">15 Mins</button>
        <button id="btn12" onclick="startTimer(720, '12mins')" style="padding:10px; border:none; border-radius:8px; background:#f44336; color:white; cursor:pointer;">12 Mins</button>
        <button id="btn10" onclick="startTimer(600, '10mins')" style="padding:10px; border:none; border-radius:8px; background:#f44336; color:white; cursor:pointer;">10 Mins</button>
        <button id="btn5" onclick="startTimer(300, '5mins')" style="padding:10px; border:none; border-radius:8px; background:#4CAF50; color:white; cursor:pointer;">5 Mins</button>
        <button id="btn1" onclick="startTimer(60, '1min')" style="padding:10px; border:none; border-radius:8px; background:#4CAF50; color:white; cursor:pointer;">1 Min</button>
    </div>


<!-- External Control Buttons -->
<div style="margin-top:15px; display:flex; gap:10px;">
    
    <button id="stopBtn" onclick="stopTimer()" style="
        padding:12px 30px;
        border:none;
        border-radius:8px;
        background:#666;
        color:white;
        font-size:16px;
        cursor:pointer;
        box-shadow:0 4px 10px rgba(0,0,0,0.25);
        outline:2px solid rgba(255,255,255,0.2);
        transition:all 0.2s ease;
    "
    onmouseover="this.style.background='#777'"
    onmouseout="this.style.background='#666'">
        Stop
    </button>

    <button id="restartBtn" onclick="restartTimer()" style="
        padding:12px 30px;
        border:none;
        border-radius:8px;
        background:#222;
        color:white;
        font-size:16px;
        cursor:pointer;
        box-shadow:0 4px 10px rgba(0,0,0,0.3);
        outline:2px solid rgba(255,255,255,0.15);
        transition:all 0.2s ease;
    "
    onmouseover="this.style.background='#333'"
    onmouseout="this.style.background='#222'">
        Restart
    </button>

</div>

<!-- Flash Screen -->
<div id="flashScreen" onclick="stopAlert()" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#00ff66;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:80px;
font-weight:bold;
color:#003d1f;
z-index:9999;
">
<div id="doneText">DONE</div>
<button id="okBtn" onclick="stopAlert(); event.stopPropagation();" style="
margin-top:30px;
padding:15px 40px;
font-size:20px;
border:none;
border-radius:10px;
background:#ffffff;
color:#003d1f;
cursor:pointer;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
">
OK
</button>
</div>

<script>
let interval = null;
let flashInterval = null;
let remaining = 0;
let originalDuration = 0;
let currentBg = null;
let currentLang = "en";
let wakeLock = null;

// Alarm audio
let alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/medium_bell_ringing_near.ogg");
alarmAudio.loop = false;

/* ---------- LANGUAGE SYSTEM ---------- */
const langData = {
    en: { /* ... your language data ... */ },
    tr: { /* ... your language data ... */ }
};

function applyLanguage() {
    currentLang = navigator.language.startsWith("tr") ? "tr" : "en";
    const t = langData[currentLang];

    document.documentElement.lang = currentLang;
    document.title = t.title;
    document.getElementById("appTitle").textContent = t.header;
    document.getElementById("doneText").textContent = t.flashDone;
    document.getElementById("okBtn").textContent = t.ok;
    document.getElementById("stopBtn").textContent = t.stop;
    document.getElementById("restartBtn").textContent = t.restart;
    for (let id in t.buttons) {
        const el = document.getElementById(id);
        if (el) el.textContent = t.buttons[id];
    }
}

applyLanguage();

/* ---------- TIMER SYSTEM ---------- */
function setBackground(type) {
    const body = document.getElementById("body");
    const backgrounds = { /* ... your backgrounds ... */ };
    body.style.backgroundImage = backgrounds[type];
}

function formatTime(seconds) {
    const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    return hrs + ":" + mins + ":" + secs;
}

function enterFullscreen() {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
}

function exitFullscreen() {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
}

function startFlash() {
    const flash = document.getElementById("flashScreen");
    flash.style.display = "flex";
    let on = false;
    flashInterval = setInterval(() => {
        on = !on;
        flash.style.background = on ? "#a8f0c6" : "#1f4733";
        flash.style.color = on ? "#1f4733" : "#a8f0c6";
    }, 300);
}

function stopFlash() {
    clearInterval(flashInterval);
    document.getElementById("flashScreen").style.display = "none";
}

function stopAlert() {
    stopFlash();
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
    exitFullscreen();
}

/* ---------- WAKE LOCK ---------- */
async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
                console.log('Wake lock released, requesting again...');
                requestWakeLock(); // auto re-acquire
            });
        }
    } catch (err) {
        console.log('Wake lock failed:', err);
    }
}

async function initBackgroundPermissions() {
    // Notifications
    if ('Notification' in window && Notification.permission !== 'granted') {
        await Notification.requestPermission();
    }
    // Wake lock
    await requestWakeLock();
}

/* ---------- ALERT SYSTEM ---------- */
function alertUser() {
    // Vibrate even if screen is off
    if ('vibrate' in navigator) navigator.vibrate([500, 200, 500]);

    // Play audio (works only if screen on)
    alarmAudio.play().catch(e => console.log('Audio blocked:', e));

    // Notifications
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification("Timer Done!", {
            body: "Your countdown finished!",
            icon: "icon-192.png",
            vibrate: [500, 200, 500]
        });
    }

    // Flash the screen
    startFlash();
}

/* ---------- TIMER ---------- */
function startTimerNonThrottled(durationSec, bgType) {
    stopTimer(); 
    originalDuration = durationSec;
    currentBg = bgType;
    setBackground(bgType);
    requestWakeLock();

    const endTime = Date.now() + durationSec * 1000;

    interval = setInterval(() => {
        const remainingSec = Math.round((endTime - Date.now()) / 1000);
        document.getElementById("display").textContent = formatTime(Math.max(0, remainingSec));

        if (remainingSec <= 0) {
            clearInterval(interval);
            document.getElementById("display").textContent = langData[currentLang].done;
            alertUser(); // <----- REPLACE previous alarmAudio.play() + startFlash()
        }
    }, 200);
}

function stopTimer() {
    clearInterval(interval);
    stopAlert();
    remaining = 0;
    document.getElementById("display").textContent = "00:00:00";
}

function restartTimer() {
    if (originalDuration > 0) {
        startTimerNonThrottled(originalDuration, currentBg);
    }
}

/* ---------- BUTTONS ---------- */
const buttons = [
    {id: "btn3h", sec: 10800, bg: "3hours"},
    {id: "btn2h", sec: 7200, bg: "2hours"},
    {id: "btn1h", sec: 3600, bg: "mountain"},
    {id: "btn30", sec: 1800, bg: "ocean"},
    {id: "btn20", sec: 1200, bg: "forest"},
    {id: "btn15", sec: 900, bg: "15mins"},
    {id: "btn12", sec: 720, bg: "12mins"},
    {id: "btn10", sec: 600, bg: "10mins"},
    {id: "btn5", sec: 300, bg: "5mins"},
    {id: "btn1", sec: 60, bg: "1min"}
];

buttons.forEach(btn => {
    const el = document.getElementById(btn.id);
    if (el) {
        el.removeAttribute("onclick");
        el.addEventListener("click", () => {
            initBackgroundPermissions().then(() => startTimerNonThrottled(btn.sec, btn.bg));
        });
    }
});

/* ---------- APP RELOAD ---------- */
document.getElementById("appTitle").addEventListener("click", () => {
    window.location.href = window.location.origin + window.location.pathname;
});
</script>
