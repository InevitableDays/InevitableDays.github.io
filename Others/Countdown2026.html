// TIMER SYSTEM ----------
function setBackground(type) {

function formatTime(seconds) {
    const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    return hrs + ":" + mins + ":" + secs;
}
    
function enterFullscreen() {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
}

function exitFullscreen() {
    if (document.fullscreenElement) {
        document.exitFullscreen();
    }
}
    
function startFlash() {
    const flash = document.getElementById("flashScreen");
    flash.style.display = "flex";
    let on = false;

flashInterval = setInterval(function () {
    on = !on;
    flash.style.background = on ? "#a8f0c6" : "#1f4733"; // gentle mint / muted green
    flash.style.color = on ? "#1f4733" : "#a8f0c6";       // inverse for contrast
}, 300);
}

function stopFlash() {
    clearInterval(flashInterval);
    document.getElementById("flashScreen").style.display = "none";
}

function stopAlert() {
    stopFlash();
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
    exitFullscreen();
}

function startTimer(seconds, bgType) {
    clearInterval(interval);
    stopAlert();

    originalDuration = seconds;
    currentBg = bgType;
    remaining = seconds;

    setBackground(bgType);
    document.getElementById("display").textContent = formatTime(remaining);

    interval = setInterval(function () {
        remaining--;

        if (remaining <= 0) {
            clearInterval(interval);
            document.getElementById("display").textContent = langData[currentLang].done;
            enterFullscreen();
            alarmAudio.play();
            startFlash();
            return;
        }

        document.getElementById("display").textContent = formatTime(remaining);
    }, 1000);
}

function stopTimer() {
    clearInterval(interval);
    stopAlert();
    remaining = 0;
    document.getElementById("display").textContent = "00:00:00";
}

function restartTimer() {
    if (originalDuration > 0) {
        startTimer(originalDuration, currentBg);
    }
}

    
// ----- wake lock + Non-Throttled Timer -----
// Request wake lock
let wakeLock = null;
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request("screen");
            console.log("Wake Lock acquired");
            wakeLock.addEventListener('release', () => {
                console.log("Wake Lock released");
                // try to re-acquire automatically
                requestWakeLock();
            });
        } catch (err) {
            console.log("Wake Lock request failed:", err);
        }
    }
}

// Re-acquire wake lock on visibility change
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        requestWakeLock();
    }
});

// Initial wake lock request
requestWakeLock();

// Non-throttled countdown timer (works better in background)
function startTimerNonThrottled(durationSec, bgType) {
    stopTimer(); // stop any previous timer
    originalDuration = durationSec;
    currentBg = bgType;
    setBackground(bgType);

    const startTime = Date.now();
    const endTime = startTime + durationSec * 1000;

    interval = setInterval(() => {
        const now = Date.now();
        const remainingSec = Math.round((endTime - now) / 1000);

        document.getElementById("display").textContent = formatTime(Math.max(0, remainingSec));

        if (remainingSec <= 0) {
            clearInterval(interval);
            document.getElementById("display").textContent = langData[currentLang].done;
            alarmAudio.play();
            startFlash();
        }
    }, 200); // update every 200ms
}

// create silent audio buffer
let audioContext = null;
let silentSource = null;

function startSilentAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (!silentSource || silentSource.playbackState === silentSource.FINISHED_STATE) {
        const buffer = audioContext.createBuffer(1, audioContext.sampleRate, audioContext.sampleRate);
        silentSource = audioContext.createBufferSource();
        silentSource.buffer = buffer;
        silentSource.loop = true;
        silentSource.connect(audioContext.destination);
        silentSource.start();
        console.log("Silent audio started");
    }
}

function stopSilentAudio() {
    if (silentSource) {
        silentSource.stop();
        silentSource.disconnect();
        silentSource = null;
        console.log("Silent audio stopped");
    }
}

// Usage with your timer
document.body.addEventListener("click", () => {
    // unlock audio + start silent loop
    if (audioContext && audioContext.state === "suspended") audioContext.resume();
    startSilentAudio();
});

// In your timer end:
if (remainingSec <= 0) {
    clearInterval(interval);
    document.getElementById("display").textContent = langData[currentLang].done;

    stopSilentAudio();    // stop the silent buffer
    alarmAudio.play();    // play the real alarm sound

// Re-wire all buttons to use background-friendly timer

        el.removeAttribute("onclick"); // remove old handler
        el.addEventListener("click", () => {
            initBackgroundPermissions().then(() => startTimerNonThrottled(btn.sec, btn.bg));
        });

});

function showMobileReminder() {
    if (!/Mobi|Android/i.test(navigator.userAgent)) return; // only on mobile

    const reminder = langData[currentLang].mobileReminder;

    `;
    div.innerText = `${reminder.title}\n${reminder.message}\n${reminder.tapToHide}`;
    div.addEventListener("click", () => div.remove());
    document.body.appendChild(div);
}

    // --- 3. Only  mobile ---
    if (/Mobi|Android/i.test(navigator.userAgent)) {
        const div = document.createElement("div");
        div.id = "screenHint";
        div.style = `
            margin-top: 8px;
            font-size: 12px;
            color: #FFFFFF;
            text-align: center;
            font-style: italic;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        `;
        div.textContent = screenHintText[userLang];

        // Append right under timer container (assumes #app exists)
        const app = document.getElementById("app");
        if (app) app.appendChild(div);
    }
})();
</script>
    <script>
// Fethiye coordinates
const lat = 36.6219;
const lon = 29.1164;

function getWeather() {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`)
    .then(response => response.json())
    .then(data => {
      const temp = Math.round(data.current_weather.temperature);
      const code = data.current_weather.weathercode;

      document.getElementById("temp").innerHTML = temp + "°C";

      const icon = document.getElementById("icon");

      // Simple weather code mapping
      if (code === 0) icon.textContent = "☀️";
      else if (code <= 3) icon.textContent = "⛅";
      else if (code <= 48) icon.textContent = "☁️";
      else if (code <= 67) icon.textContent = "🌧️";
      else if (code <= 77) icon.textContent = "❄️";
      else if (code <= 99) icon.textContent = "⛈️";
      else icon.textContent = "☀️";

      localStorage.setItem("weatherData", JSON.stringify({
        date: new Date().toDateString(),
        temp: temp,
        code: code
      }));
    });
}

function loadWeather() {
  const saved = JSON.parse(localStorage.getItem("weatherData"));

  if (saved && saved.date === new Date().toDateString()) {
    document.getElementById("temp").innerHTML = saved.temp + "°C";

    const icon = document.getElementById("icon");

    if (saved.code === 0) icon.textContent = "Fethiye ☀️";
    else if (saved.code <= 3) icon.textContent = "Fethiye ⛅";
    else if (saved.code <= 48) icon.textContent = "Fethiye ☁️";
    else if (saved.code <= 67) icon.textContent = "Fethiye 🌧️";
    else if (saved.code <= 77) icon.textContent = "Fethiye ❄️";
    else if (saved.code <= 99) icon.textContent = "Fethiye ⛈️";
    else icon.textContent = "Fethiye ☀️";
  } else {
    getWeather();
  }
}

loadWeather();
</script>
