<script>
    
let interval = null;

alarmAudio.loop = true;

/* ---------- LANGUAGE SYSTEM ---------- */

const langData = {

        ok: "OK",

            btn20: "20 Dakika",
            btn15: "15 Dakika",
            btn12: "12 Dakika",
            btn10: "10 Dakika",
            btn5: "5 Dakika"
        }
    }
};

function applyLanguage() {
    currentLang = navigator.language.startsWith("tr") ? "tr" : "en";
    const t = langData[currentLang];

    document.documentElement.lang = currentLang;
    document.title = t.title;

    document.getElementById("appTitle").textContent = t.header;
    document.getElementById("doneText").textContent = t.flashDone;
    document.getElementById("okBtn").textContent = t.ok;
    document.getElementById("stopBtn").textContent = t.stop;
    document.getElementById("restartBtn").textContent = t.restart;

    for (let id in t.buttons) {
        const el = document.getElementById(id);
        if (el) el.textContent = t.buttons[id];
    }
}

applyLanguage();

/* ---------- TIMER SYSTEM ---------- */
function setBackground(type) {
    const body = document.getElementById("body");
    const backgrounds = {
        "2hours": "url('https://images.unsplash.com/photo-1576164285450-6d26c5b1a2a6?q=80&w=1600')",
        "mountain": "url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600')",
        "ocean": "url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600')",
        "forest": "url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1600')",
        "15mins": "url('https://images.unsplash.com/photo-1764150673466-da28d5d5ad5d?q=80&w=1600')",
        "12mins": "url('https://images.unsplash.com/photo-1576698961197-48ba14d8265c?q=80&w=1600')",
        "10mins": "url('https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?q=80&w=1600')",
        "5mins": "url('https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?q=80&w=1600')"
    };
    body.style.backgroundImage = backgrounds[type];
}

function formatTime(seconds) {
    const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
    const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
    const secs = String(seconds % 60).padStart(2, '0');
    return hrs + ":" + mins + ":" + secs;
}

function startFlash() {
    const flash = document.getElementById("flashScreen");
    flash.style.display = "flex";
    let on = false;

flashInterval = setInterval(function () {
    on = !on;
    flash.style.background = on ? "#a8f0c6" : "#1f4733"; // gentle mint / muted green
    flash.style.color = on ? "#1f4733" : "#a8f0c6";       // inverse for contrast
}, 300);
}

function stopFlash() {
    clearInterval(flashInterval);
    document.getElementById("flashScreen").style.display = "none";
}

function stopAlert() {
    stopFlash();
    alarmAudio.pause();
    alarmAudio.currentTime = 0;
}

function startTimer(seconds, bgType) {
    clearInterval(interval);
    stopAlert();

    originalDuration = seconds;
    currentBg = bgType;
    remaining = seconds;

    setBackground(bgType);
    document.getElementById("display").textContent = formatTime(remaining);

    interval = setInterval(function () {
        remaining--;

        if (remaining <= 0) {
            clearInterval(interval);
            document.getElementById("display").textContent = langData[currentLang].done;
            enterFullscreen();
            alarmAudio.play();
            startFlash();
            return;
        }

        document.getElementById("display").textContent = formatTime(remaining);
    }, 1000);
}

function stopTimer() {
    clearInterval(interval);
    stopAlert();
    remaining = 0;
    document.getElementById("display").textContent = "00:00:00";
}

function restartTimer() {
    if (originalDuration > 0) {
        startTimer(originalDuration, currentBg);
    }
}


//relander

    // Go to base URL without hash

    /* testing */

// ----- Background Permissions + Non-Throttled Timer -----
let wakeLock = null;

// Request wake lock
async function requestWakeLock() {
    if ('wakeLock' in navigator) {
        try {
            wakeLock = await navigator.wakeLock.request("screen");
            console.log("Wake Lock acquired");
            wakeLock.addEventListener('release', () => {
                console.log("Wake Lock released");
                // try to re-acquire automatically
                requestWakeLock();
            });
        } catch (err) {
            console.log("Wake Lock request failed:", err);
        }
    }
}

// Re-acquire wake lock on visibility change
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        requestWakeLock();
    }
});

// Initial wake lock request
requestWakeLock();

// Non-throttled countdown timer (works better in background)
function startTimerNonThrottled(durationSec, bgType) {
    stopTimer(); // stop any previous timer
    originalDuration = durationSec;
    currentBg = bgType;
    setBackground(bgType);

    const startTime = Date.now();
    const endTime = startTime + durationSec * 1000;

    interval = setInterval(() => {
        const now = Date.now();
        const remainingSec = Math.round((endTime - now) / 1000);

        document.getElementById("display").textContent = formatTime(Math.max(0, remainingSec));

        if (remainingSec <= 0) {
            clearInterval(interval);
            document.getElementById("display").textContent = langData[currentLang].done;
            alarmAudio.play();
            startFlash();
        }
    }, 200); // update every 200ms
}

// Non-throttled countdown timer (works better in background)
function startTimerNonThrottled(durationSec, bgType) {
    stopTimer(); // stop any previous timer
    originalDuration = durationSec;
    currentBg = bgType;
    setBackground(bgType);

    const startTime = Date.now();
    const endTime = startTime + durationSec * 1000;

    interval = setInterval(() => {
        const now = Date.now();
        const remainingSec = Math.round((endTime - now) / 1000);

        document.getElementById("display").textContent = formatTime(Math.max(0, remainingSec));

        if (remainingSec <= 0) {
            clearInterval(interval);
            document.getElementById("display").textContent = langData[currentLang].done;

            stopSilentAudio();    // stop silent audio before real alarm
            alarmAudio.play();    // play the real alarm sound
            startFlash();
        }
    }, 200); // update every 200ms
}

// ---------- Silent Audio Unlock ----------
let audioContext = null;
let silentSource = null;

function startSilentAudio() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (!silentSource) {
        const buffer = audioContext.createBuffer(1, audioContext.sampleRate, audioContext.sampleRate);
        silentSource = audioContext.createBufferSource();
        silentSource.buffer = buffer;
        silentSource.loop = true;
        silentSource.connect(audioContext.destination);
        silentSource.start();
        console.log("Silent audio started");
    } else if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function stopSilentAudio() {
    if (silentSource) {
        silentSource.stop();
        silentSource.disconnect();
        silentSource = null;
        console.log("Silent audio stopped");
    }
}

// Unlock audio when user clicks anywhere (including timer buttons)
document.body.addEventListener("click", () => {
    startSilentAudio();
});
    
// Re-wire all buttons to use background-friendly timer
const buttons = [
    {id: "btn2h", sec: 7200, bg: "2hours"},
    {id: "btn1h", sec: 3600, bg: "mountain"},

];

buttons.forEach(btn => {

    if (el) {
        el.removeAttribute("onclick"); // remove old handler
        el.addEventListener("click", () => {
            initBackgroundPermissions().then(() => startTimerNonThrottled(btn.sec, btn.bg));

    }
});
