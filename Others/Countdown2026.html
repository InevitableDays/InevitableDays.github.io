<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Countdown Now</title>
<meta name="theme-color" content="#111111">
<meta name="description" content="Fullscreen focus countdown timer with background themes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" as="image" href="https://images.unsplash.com/photo-1692699203597-b5a4464f3f9c?q=80&w=1600">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    overflow: auto;
    transition: background 0.5s ease;
    background: url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1600");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}
@media (max-width: 900px) {
    body {
        background-attachment: scroll;
    }
}
#app {
    width: 320px;
    max-width: 90vw;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    text-align: center;
}
</style>
</head>
<body id="body">
<div id="app" style="background: rgba(255, 228, 200, 0.27); backdrop-filter: blur(4px); padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.20); text-align: center; width: 320px; max-width: 90vw;">
    <h2 id="appTitle" style="margin-bottom:20px; cursor: pointer; color:#333;">Countdown Timer</h2>
    <div id="display" style="font-size:48px; font-weight:bold; margin-bottom:25px; color:#222;">00:00:00</div>
</div>
<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
    <button id="btn3h">3 Hours</button>
    <button id="btn2h">2 Hours</button>
    <button id="btn1h">1 Hour</button>
    <button id="btn30">30 Mins</button>
    <button id="btn20">20 Mins</button>
    <button id="btn15">15 Mins</button>
    <button id="btn12">12 Mins</button>
    <button id="btn10">10 Mins</button>
</div>
<div style="margin-top:15px; display:flex; gap:10px;">
    <button id="stopBtn">Stop</button>
    <button id="restartBtn">Restart</button>
</div>
<div id="flashScreen" onclick="stopAlert()" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#00ff66; display:none; flex-direction:column; justify-content:center; align-items:center; font-size:80px; font-weight:bold; color:#003d1f; z-index:9999;">
    <div id="doneText">DONE</div>
    <button id="okBtn" onclick="stopAlert(); event.stopPropagation();" style="margin-top:30px; padding:15px 40px; font-size:20px; border:none; border-radius:10px; background:#ffffff; color:#003d1f; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.2);">OK</button>
</div>

<script>
let interval = null;
let flashInterval = null;
let remaining = 0;
let originalDuration = 0;
let currentBg = null;
let currentLang = "en";
let wakeLock = null;

// Initialize alarm audio on first user interaction
let alarmAudio = new Audio("https://actions.google.com/sounds/v1/alarms/medium_bell_ringing_near.ogg");
alarmAudio.loop = true;
document.body.addEventListener('click', () => {
    alarmAudio.play().then(() => alarmAudio.pause());
}, {once:true});

// Language
const langData = {
    en: { title:"Countdown Now", header:"Countdown Timer", done:"Done!", flashDone:"DONE", ok:"OK", stop:"Stop", restart:"Restart", buttons:{btn3h:"3 Hours",btn2h:"2 Hours",btn1h:"1 Hour",btn30:"30 Mins",btn20:"20 Mins",btn15:"15 Mins",btn12:"12 Mins",btn10:"10 Mins"} },
    tr: { title:"Kronometre", header:"Zamanlayıcı", done:"Bitti!", flashDone:"Süre Doldu!", ok:"Tamam", stop:"Durdur", restart:"Yeniden Başlat", buttons:{btn3h:"3 Saat",btn2h:"2 Saat",btn1h:"1 Saat",btn30:"30 Dakika",btn20:"20 Dakika",btn15:"15 Dakika",btn12:"12 Dakika",btn10:"10 Dakika"} }
};
function applyLanguage(){
    currentLang = navigator.language.startsWith("tr")?"tr":"en";
    const t = langData[currentLang];
    document.documentElement.lang = currentLang;
    document.title = t.title;
    document.getElementById("appTitle").textContent = t.header;
    document.getElementById("doneText").textContent = t.flashDone;
    document.getElementById("okBtn").textContent = t.ok;
    document.getElementById("stopBtn").textContent = t.stop;
    document.getElementById("restartBtn").textContent = t.restart;
    for(let id in t.buttons){const el=document.getElementById(id);if(el) el.textContent=t.buttons[id];}
}
applyLanguage();

// Backgrounds
function setBackground(type){
    const body = document.getElementById("body");
    const backgrounds = {
        "3hours":"url('https://images.unsplash.com/photo-1692699203597-b5a4464f3f9c?q=80&w=1600')",
        "2hours":"url('https://images.unsplash.com/photo-1576164285450-6d26c5b1a2a6?q=80&w=1600')",
        "mountain":"url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600')",
        "ocean":"url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1600')",
        "forest":"url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1600')",
        "15mins":"url('https://images.unsplash.com/photo-1764150673466-da28d5d5ad5d?q=80&w=1600')",
        "12mins":"url('https://images.unsplash.com/photo-1576698961197-48ba14d8265c?q=80&w=1600')",
        "10mins":"url('https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?q=80&w=1600')"
    };
    body.style.backgroundImage = backgrounds[type];
}
function formatTime(seconds){
    const hrs = String(Math.floor(seconds/3600)).padStart(2,'0');
    const mins = String(Math.floor((seconds%3600)/60)).padStart(2,'0');
    const secs = String(seconds%60).padStart(2,'0');
    return hrs+":"+mins+":"+secs;
}
function enterFullscreen(){if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();}
function exitFullscreen(){if(document.fullscreenElement) document.exitFullscreen();}
function startFlash(){
    const flash=document.getElementById("flashScreen"); flash.style.display="flex";
    let on=false;
    flashInterval=setInterval(()=>{
        on=!on;
        flash.style.background=on?"#a8f0c6":"#1f4733";
        flash.style.color=on?"#1f4733":"#a8f0c6";
    },300);
}
function stopFlash(){clearInterval(flashInterval); document.getElementById("flashScreen").style.display="none";}
function stopAlert(){stopFlash(); alarmAudio.pause(); alarmAudio.currentTime=0; exitFullscreen();}

// Notifications + vibration
function notifyAlarm(){
    if('Notification' in window && Notification.permission==='granted'){
        new Notification('⏰ Timer Done!', {body:'Time is up!', icon:'icon-192.png', vibrate:[200,100,200,100,400]});
    }
    if('vibrate' in navigator) navigator.vibrate([200,100,200,100,400]);
}

// Timer
function startTimer(seconds,bgType){
    clearInterval(interval); stopAlert();
    originalDuration=seconds; currentBg=bgType; remaining=seconds;
    setBackground(bgType); document.getElementById("display").textContent=formatTime(remaining);
    interval=setInterval(()=>{
        remaining--;
        if(remaining<=0){
            clearInterval(interval);
            document.getElementById("display").textContent=langData[currentLang].done;
            enterFullscreen(); alarmAudio.play(); startFlash(); notifyAlarm();
            return;
        }
        document.getElementById("display").textContent=formatTime(remaining);
    },1000);
}
function stopTimer(){clearInterval(interval); stopAlert(); remaining=0; document.getElementById("display").textContent="00:00:00";}
function restartTimer(){if(originalDuration>0) startTimer(originalDuration,currentBg);}

// Wake lock & notifications
async function initBackgroundPermissions(){
    if('Notification' in window && Notification.permission!=='granted') await Notification.requestPermission();
    if('wakeLock' in navigator){
        try{
            wakeLock=await navigator.wakeLock.request("screen");
            wakeLock.addEventListener('release',()=>console.log("Wake Lock released"));
        }catch(err){console.log("Wake Lock failed:",err);}
    }
}

// Non-throttled timer
function startTimerNonThrottled(durationSec,bgType){
    stopTimer(); originalDuration=durationSec; currentBg=bgType; setBackground(bgType);
    const endTime=Date.now()+durationSec*1000;
    interval=setInterval(()=>{
        const remainingSec=Math.round((endTime-Date.now())/1000);
        document.getElementById("display").textContent=formatTime(Math.max(0,remainingSec));
        if(remainingSec<=0){
            clearInterval(interval);
            document.getElementById("display").textContent=langData[currentLang].done;
            alarmAudio.play(); startFlash(); notifyAlarm();
        }
    },200);
}

// Buttons
const buttons=[{id:"btn3h",sec:10800,bg:"3hours"},{id:"btn2h",sec:7200,bg:"2hours"},{id:"btn1h",sec:3600,bg:"mountain"},{id:"btn30",sec:1800,bg:"ocean"},{id:"btn20",sec:1200,bg:"forest"},{id:"btn15",sec:900,bg:"15mins"},{id:"btn12",sec:720,bg:"12mins"},{id:"btn10",sec:300,bg:"10mins"}];
buttons.forEach(btn=>{
    const el=document.getElementById(btn.id);
    if(el){ el.addEventListener("click",()=>{ initBackgroundPermissions().then(()=>startTimerNonThrottled(btn.sec,btn.bg)); }); }
});
document.getElementById("stopBtn").addEventListener("click",stopTimer);
document.getElementById("restartBtn").addEventListener("click",restartTimer);

document.getElementById("appTitle").addEventListener("click",()=>{window.location.href=window.location.origin+window.location.pathname;});
</script>
</body>
</html>
