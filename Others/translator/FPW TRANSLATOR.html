<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
}
textarea {
  width: 100%;
  height: 120px;
  padding: 15px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}
select, button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}
button { cursor: pointer; }
.translate { background: #00c853; }
.read { background: #2962ff; }

.box {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🌍 Translator</h2>

  <textarea id="inputText" placeholder="Type something..."></textarea>

  <select id="targetLang">
    <option value="tr">Turkish</option>
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
  </select>

  <button class="translate" onclick="translateText()">Translate</button>
  <button class="read" onclick="speakText()">🔊 Read</button>

  <div class="box">
    <b>Translated:</b><br>
    <span id="translatedText"></span>
  </div>
</div>

<script>
let translated = "";

// Translate
async function translateText() {
  const text = document.getElementById("inputText").value;
  const target = document.getElementById("targetLang").value;

  if (!text) return alert("Enter text");

  try {
    const res = await fetch("https://libretranslate.de/translate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        q: text,
        source: "auto",
        target: target,
        format: "text"
      })
    });

    const data = await res.json();
    translated = data.translatedText;
    document.getElementById("translatedText").innerText = translated;

  } catch {
    alert("Translation failed");
  }
}

// Speak
function speakText() {
  if (!translated) return;

  const lang = document.getElementById("targetLang").value;

  const u = new SpeechSynthesisUtterance(translated);
  u.lang = lang;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
</script>

</body>
</html>
