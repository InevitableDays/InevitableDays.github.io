<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
}
textarea, select, button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}
button { cursor: pointer; }

.listen { background: #00c853; }
.translate { background: #00c853; }
.read { background: #2962ff; }
.swap { background: #ff6d00; }

.box {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🌍 Translator</h2>

  <div id="modeLabel"></div>

  <textarea id="inputText" placeholder="Type or speak..."></textarea>

  <select id="sourceLang">
    <option value="en">English</option>
    <option value="tr">Turkish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
  </select>

  <button class="swap" onclick="swapLanguages()">🔄 Swap Languages</button>

  <select id="targetLang">
    <option value="tr">Turkish</option>
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
  </select>

  <button id="listenBtn" class="listen" onclick="startListening()">🎤 Speak</button>
  <button id="translateBtn" class="translate" onclick="translateTextFromInput()">Translate</button>

  <button class="read" onclick="speakText()">🔊 Read</button>
  <button onclick="speakBetter()">🔊 Better Voice</button>
  <div class="box">
    <b>Translated:</b><br>
    <span id="translatedText"></span>
  </div>
</div>

<script>
let translated = "";

// Detect voice support
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const isVoiceSupported = !!SpeechRecognition;

// Mode switch
if (isVoiceSupported) {
  document.getElementById("modeLabel").innerText = "🎤 Voice mode";
  document.getElementById("translateBtn").style.display = "none";
} else {
  document.getElementById("modeLabel").innerText = "✍️ Typing mode";
  document.getElementById("listenBtn").style.display = "none";
}

// Swap languages
function swapLanguages() {
  let src = document.getElementById("sourceLang");
  let tgt = document.getElementById("targetLang");
  let temp = src.value;
  src.value = tgt.value;
  tgt.value = temp;
}

// Voice input (Chrome)
function startListening() {
  if (!isVoiceSupported) return;

  const recognition = new SpeechRecognition();
  recognition.lang = document.getElementById("sourceLang").value;

  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("inputText").value = text;
    translateText(text);
  };

  recognition.onerror = function(e) {
    alert("Speech error: " + e.error);
  };
}

// Manual translate (Firefox)
function translateTextFromInput() {
  const text = document.getElementById("inputText").value;
  if (!text) return alert("Enter text");
  translateText(text);
}

// Translation (Google endpoint)
async function translateText(text) {
  const target = document.getElementById("targetLang").value;

  try {
    const res = await fetch(
      `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`
    );

    const data = await res.json();

    translated = data[0][0][0];
    document.getElementById("translatedText").innerText = translated;

  } catch (e) {
    console.error(e);
    alert("Translation failed");
  }
}

// Speak
function speakText() {
  if (!translated) return;

  const lang = document.getElementById("targetLang").value;

  const u = new SpeechSynthesisUtterance(translated);
  u.lang = lang;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
</script>
<script>
function speakBetter() {
  if (!translated) return;

  const lang = document.getElementById("targetLang").value;

  const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(translated)}&tl=${lang}&client=tw-ob`;

  const audio = new Audio(url);
  audio.play();
}
</script>
</body>
</html>
