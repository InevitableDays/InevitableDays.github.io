<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
}
textarea, select, button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
}
button { cursor: pointer; }

.listen { background: #00c853; }
.translate { background: #00c853; }
.read { background: #2962ff; }
.swap { background: #ff6d00; }

.box {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="container">
  <h2>🌍 Translator</h2>

  <div id="modeLabel"></div>

  <textarea id="inputText" placeholder="Type or speak..."></textarea>

  <select id="sourceLang">
    <option value="en">English</option>
    <option value="tr">Turkish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
  </select>

  <button class="swap" onclick="swapLanguages()">🔄 Swap Languages</button>

  <select id="targetLang">
    <option value="tr">Turkish</option>
    <option value="en">English</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ru">Russian</option>
    <option value="ar">Arabic</option>
  </select>

  <button id="listenBtn" class="listen" onclick="startListening()">🎤 Speak</button>
  <button id="translateBtn" class="translate" onclick="translateTextFromInput()">Translate</button>

  <button class="read" onclick="speakText()">🔊 Read</button>

  <div class="box">
    <b>Translated:</b><br>
    <span id="translatedText"></span>
  </div>
</div>

<script>
let translated = "";

// Detect voice support
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const isVoiceSupported = !!SpeechRecognition;

// Mode switch
if (isVoiceSupported) {
  document.getElementById("modeLabel").innerText = "🎤 Voice mode";
  document.getElementById("translateBtn").style.display = "none";
} else {
  document.getElementById("modeLabel").innerText = "✍️ Typing mode";
  document.getElementById("listenBtn").style.display = "none";
}

// Swap languages
function swapLanguages() {
  let src = document.getElementById("sourceLang");
  let tgt = document.getElementById("targetLang");
  let temp = src.value;
  src.value = tgt.value;
  tgt.value = temp;
}

// Voice input (Chrome)
function startListening() {
  if (!isVoiceSupported) return;

  const recognition = new SpeechRecognition();
  recognition.lang = document.getElementById("sourceLang").value;

  recognition.start();

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    document.getElementById("inputText").value = text;
    translateText(text);
  };

  recognition.onerror = function(e) {
    alert("Speech error: " + e.error);
  };
}

// Manual translate (Firefox)
function translateTextFromInput() {
  const text = document.getElementById("inputText").value;
  if (!text) return alert("Enter text");
  translateText(text);
}


async function translateText(text) {
  const target = document.getElementById("targetLang").value;

  const servers = [
    "https://translate.argosopentech.com/translate",
    "https://libretranslate.de/translate",
    "https://libretranslate.com/translate"
  ];

  for (let i = 0; i < servers.length; i++) {
    try {
      const res = await fetch(servers[i], {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          q: text,
          source: "auto",
          target: target,
          format: "text"
        })
      });

      const data = await res.json();

      if (data.translatedText) {
        translated = data.translatedText;
        document.getElementById("translatedText").innerText = translated;
        return; // success → stop trying
      }

    } catch (e) {
      console.warn("Server failed:", servers[i]);
    }
  }

  alert("All translation servers failed. Try again.");
}
// Translation (fixed endpoint)
async function translateText(text) {
  const target = document.getElementById("targetLang").value;

  try {
    const res = await fetch("https://translate.argosopentech.com/translate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        q: text,
        source: "auto",
        target: target,
        format: "text"
      })
    });

    const data = await res.json();

    if (!data.translatedText) {
      alert("Translation failed");
      return;
    }

    translated = data.translatedText;
    document.getElementById("translatedText").innerText = translated;

  } catch (e) {
    console.error(e);
    alert("Translation server error");
  }
}

// Speak
function speakText() {
  if (!translated) return;

  const lang = document.getElementById("targetLang").value;

  const u = new SpeechSynthesisUtterance(translated);
  u.lang = lang;

  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
</script>

</body>
</html>
