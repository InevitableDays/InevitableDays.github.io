<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin:0;
  padding:0 10px;
  background:url('https://InevitableDays.github.io/images/Canyon.jpg') no-repeat center/cover fixed;
  color:#e2e8f0;
  background-color:#266485;
}

header {
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:700;
}

.topbar {
  text-align:center;
  margin-bottom:10px;
}

button {
  background:#1e293b;
  color:#e2e8f0;
  border:none;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  max-width:1000px;
  margin:auto;
}

.panel {
  display:flex;
  flex-direction:column;
  gap:6px;
}

.currency-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.currency-buttons button {
  font-size:11px;
  padding:6px;
  opacity:0.6;
}

.currency-buttons button.active {
  opacity:1;
  box-shadow:0 0 8px rgba(255,140,0,0.8);
}

textarea {
  width:100%;
  height:160px;
  background:rgba(2,6,23,0.7);
  color:#e2e8f0;
  border:1px solid #1e293b;
  padding:10px;
  border-radius:8px;
}

.history {
  max-width:1000px;
  margin:10px auto;
  font-size:13px;
  opacity:0.8;
}

#output {
  pointer-events: none;
}

* {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
}
  
@media (max-width: 900px){

  html, body{
    margin:0;
    padding:0;
    overflow-x:hidden;
  }

  body{
    min-height:100dvh;
    padding:0 6px;
    background-attachment:scroll;
  }

  header{
    font-size:20px;
    padding:12px 6px;
  }

  .topbar{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }

  button{
    padding:8px 10px;
    font-size:13px;
  }

  .container{
    grid-template-columns:1fr;
    gap:10px;
    max-width:100%;
  }

  .panel{
    gap:4px;
  }

  .currency-buttons{
    gap:4px;
  }

  .currency-buttons button{
    font-size:10px;
    padding:5px;
    flex:1 1 calc(33.33% - 4px);
  }

  textarea{
    height:15px;
    font-size:14px;
  }
  .topbar {
    display: none;
  }
  
  #history {
  pointer-events: none;
  }
}

button.pressed {
  transform: scale(0.96);
}

</style>
</head>
<body>
<header>Currency Converter</header>

<div class="topbar">
  <button onclick="clearAll()">Clear</button>
  <button onclick="pasteInput()">Paste</button>
  <button onclick="copyOutput()">Copy Result</button>
</div>

<div class="container">

  <div class="panel">
    <div class="currency-buttons" id="leftButtons"></div>
    <textarea id="input" placeholder="Enter value..."></textarea>
  </div>

  <div class="panel">
    <div class="currency-buttons" id="rightButtons"></div>
    <textarea id="output" placeholder="Result..." readonly></textarea>
  </div>

</div>

<div class="history" id="history"></div>

  <!-- ver. -->
<div id="versionNote" style="
    position: fixed;
    bottom: 10px;
    right: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    font-family: Arial, sans-serif;
    pointer-events: none;
    user-select: none;
    z-index:9999;
">
    v1.0.5 – 2026, Umit Ozkul
</div>
<script>
const currencyData = {
  TRY: "Turkish Lira (₺)",
  EUR: "Euro (€)",
  USD: "US Dollar ($)",
  GBP: "Sterling (£)",
  CAD: "Canadian ($)",
  AUD: "Australian ($)",
  CNY: "Chinese Yuan (¥)",
  RUB: "Russian Ruble (₽)",
  TWD: "Taiwan Dollar ($)",
  THB: "Thai Baht (฿)",
  PHP: "Philippine Peso (₱)",
  SAR: "Saudi Riyal (﷼)",
  EGP: "Egypt Pound (£)",
  VES: "Venezuelan Bolívar (Bs)",
  ARS: "Argentine Peso ($)",
  BRL: "Brazilian Real (R$)"
};

const list = Object.keys(currencyData);

const leftDiv = document.getElementById("leftButtons");
const rightDiv = document.getElementById("rightButtons");
const input = document.getElementById("input");
const output = document.getElementById("output");
const historyDiv = document.getElementById("history");

let from = "TRY";
let to = "USD";
let rates = {};

async function loadRates(){
  const res = await fetch("https://open.er-api.com/v6/latest/TRY");
  const data = await res.json();
  rates = data.rates;
}

function createButtons(container, side){
  list.forEach(cur=>{
    const btn = document.createElement("button");
    btn.textContent = currencyData[cur];

    if((side==="left" && cur===from) || (side==="right" && cur===to)){
      btn.classList.add("active");
    }

    btn.onclick = ()=>{
      if(side==="left") from = cur;
      else to = cur;

      if(from === to){
        if(side==="left") to = list.find(c=>c!==from);
        else from = list.find(c=>c!==to);
      }

      updateActive();
      run();
    };

    btn.onmousedown = (e)=>e.preventDefault();
    container.appendChild(btn);
  });
}

function updateActive(){
  [...leftDiv.children].forEach(b=>{
    b.classList.toggle("active", b.textContent===currencyData[from]);
  });

  [...rightDiv.children].forEach(b=>{
    b.classList.toggle("active", b.textContent===currencyData[to]);
  });
}

function convert(val){
  const n = parseFloat(val);
  if(isNaN(n)) return "invalid";

  let inTRY = from==="TRY" ? n : n / rates[from];
  let result = to==="TRY" ? inTRY : inTRY * rates[to];

  return result.toFixed(2);
}

function run(){
  const lines = input.value.split("\n");
  const results = lines.map(l=>convert(l));
  output.value = results.join("\n");
  saveHistory(input.value, output.value);
}

function clearAll(){
  input.value="";
  output.value="";
}

function copyOutput(){
  navigator.clipboard.writeText(output.value);
}

document.querySelectorAll('.topbar button').forEach(btn=>{
  btn.onmousedown = (e)=>e.preventDefault();
});

input.addEventListener("input", ()=>{
  let cleaned = input.value
    .replace(/[^\d.\-\n]/g, "")
    .replace(/(\..*)\./g, "$1");

  input.value = cleaned;
  run();
});

function saveHistory(i,o){
  if(!i.trim()) return;

  let h = JSON.parse(localStorage.getItem('hist')||'[]');
  h.unshift({i,o,from,to});
  h = h.slice(0,5);

  localStorage.setItem('hist', JSON.stringify(h));
  renderHistory();
}

function renderHistory(){
  const h = JSON.parse(localStorage.getItem('hist')||'[]');

  historyDiv.innerHTML = h.map((x,idx)=>`
    <div data-i="${idx}" style="cursor:pointer;">
      ${currencyData[x.from]} → ${currencyData[x.to]} | ${x.i} = ${x.o}
    </div>
  `).join('');

  [...historyDiv.children].forEach((el,idx)=>{
    el.onclick = ()=>{
      const item = h[idx];

      from = item.from;
      to = item.to;
      input.value = item.i;

      updateActive();
      run();
      input.focus();
    };
  });
}

setInterval(async ()=>{
  await loadRates();
  run();
}, 600000);

loadRates().then(()=>{
  createButtons(leftDiv,"left");
  createButtons(rightDiv,"right");
  renderHistory();
  input.focus();
});

document.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('touchstart', ()=>btn.classList.add('pressed'));
  btn.addEventListener('touchend', ()=>btn.classList.remove('pressed'));

  btn.addEventListener('mousedown', ()=>btn.classList.add('pressed'));
  btn.addEventListener('mouseup', ()=>btn.classList.remove('pressed'));
  btn.addEventListener('mouseleave', ()=>btn.classList.remove('pressed'));
});

async function pasteInput(){
  try {
    const text = await navigator.clipboard.readText();
    input.value = text;
    run();
    input.focus();
  } catch(e){
    alert("Paste not allowed. Use long-press → Paste.");
  }
}


// something something enter kills keyboard for mobile
  input.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    input.blur(); // closes keyboard
  }
});

  //clear input output on load
  input.value = "";
  output.value = "";
</script>
<div style="display:flex; justify-content:center; gap:-1px; margin-top:1px;">
  <iframe
    src="https://goldbroker.com/widget/live-price/XAU?currency=TRY&weight_unit=g"
    width="120"
    height="100"
    frameborder="0"
    style="border:0; overflow:hidden;">
  </iframe>
  <iframe
    src="https://goldbroker.com/widget/live-price/XAG?currency=TRY&weight_unit=g"
    width="120"
    height="100"
    frameborder="0"
    style="border:0; overflow:hidden;">
  </iframe>
</div>
</body>
</html>
