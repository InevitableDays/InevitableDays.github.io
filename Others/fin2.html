<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>

<style>
body {
  font-family: system-ui, sans-serif;
  margin:0;
  padding:0 10px;
  background:url('https://InevitableDays.github.io/images/Canyon.jpg') no-repeat center/cover fixed;
  color:#e2e8f0;
  background-color:#266485;
}

header {
  padding:18px;
  text-align:center;
  font-size:26px;
  font-weight:700;
}

.topbar {
  text-align:center;
  margin-bottom:10px;
}

button {
  background:#1e293b;
  color:#e2e8f0;
  border:none;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
}

.container {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  max-width:1000px;
  margin:auto;
}

.panel {
  display:flex;
  flex-direction:column;
  gap:6px;
}

.currency-buttons {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.currency-buttons button {
  font-size:11px;
  padding:6px;
  opacity:0.6;
}

.currency-buttons button.active {
  opacity:1;
  box-shadow:0 0 8px rgba(255,140,0,0.8);
}

textarea {
  width:100%;
  height:160px;
  background:rgba(2,6,23,0.7);
  color:#e2e8f0;
  border:1px solid #1e293b;
  padding:10px;
  border-radius:8px;
}

.history {
  max-width:1000px;
  margin:10px auto;
  font-size:13px;
  opacity:0.8;
}

@media (max-width: 900px){
  .container {
    grid-template-columns:1fr;
  }
}

button.pressed {
  transform: scale(0.96);
}

#kbBtn {
  position: fixed;
  bottom: 14px;
  right: 14px;
  z-index: 999;
  padding: 12px;
  border-radius: 50%;
  font-size: 18px;
  opacity: 0.8;
}

@media (min-width: 768px){
  #kbBtn {
    display: none;
  }
}


</style>
</head>

<body>

<header>Currency Converter</header>

<div class="topbar">
  <button onclick="clearAll()">Clear</button>
  <button onclick="pasteInput()">Paste</button>
  <button onclick="copyOutput()">Copy Result</button>
</div>

<div class="container">

  <div class="panel">
    <div class="currency-buttons" id="leftButtons"></div>
    <textarea id="input" placeholder="Enter value..."></textarea>
  </div>

  <div class="panel">
    <div class="currency-buttons" id="rightButtons"></div>
    <textarea id="output" placeholder="Result..." readonly></textarea>
  </div>

</div>
<button id="kbBtn">⌨️</button>
<div class="history" id="history"></div>

<script>
const currencyData = {
  TRY: "Turkish Lira (₺)",
  EUR: "Euro (€)",
  USD: "US Dollar ($)",
  GBP: "Sterling (£)",
  CAD: "Canadian ($)",
  AUD: "Australian ($)",
  CNY: "Yuan (¥)",
  RUB: "Ruble (₽)",
  TWD: "Taiwan ($)",
  THB: "Thai Baht (฿)"
};

const list = Object.keys(currencyData);

const leftDiv = document.getElementById("leftButtons");
const rightDiv = document.getElementById("rightButtons");
const input = document.getElementById("input");
const output = document.getElementById("output");
const historyDiv = document.getElementById("history");

let from = "TRY";
let to = "USD";
let rates = {};

async function loadRates(){
  const res = await fetch("https://open.er-api.com/v6/latest/TRY");
  const data = await res.json();
  rates = data.rates;
}

function createButtons(container, side){
  list.forEach(cur=>{
    const btn = document.createElement("button");
    btn.textContent = currencyData[cur];

    if((side==="left" && cur===from) || (side==="right" && cur===to)){
      btn.classList.add("active");
    }

    btn.onclick = ()=>{
      if(side==="left") from = cur;
      else to = cur;

      if(from === to){
        if(side==="left") to = list.find(c=>c!==from);
        else from = list.find(c=>c!==to);
      }

      updateActive();
      run();
    };

    // prevent losing focus
    btn.onmousedown = (e)=>e.preventDefault();
    btn.ontouchstart = (e)=>e.preventDefault();

    container.appendChild(btn);
  });
}

function updateActive(){
  [...leftDiv.children].forEach(b=>{
    b.classList.toggle("active", b.textContent===currencyData[from]);
  });

  [...rightDiv.children].forEach(b=>{
    b.classList.toggle("active", b.textContent===currencyData[to]);
  });
}

function convert(val){
  const n = parseFloat(val);
  if(isNaN(n)) return "invalid";

  let inTRY = from==="TRY" ? n : n / rates[from];
  let result = to==="TRY" ? inTRY : inTRY * rates[to];

  return result.toFixed(2);
}

function run(){
  const lines = input.value.split("\n");
  const results = lines.map(l=>convert(l));
  output.value = results.join("\n");
  saveHistory(input.value, output.value);
}

function clearAll(){
  input.value="";
  output.value="";
}

function copyOutput(){
  navigator.clipboard.writeText(output.value);
}
// focus consistency fk
document.querySelectorAll('.topbar button').forEach(btn=>{
  btn.onmousedown = (e)=>e.preventDefault();
  btn.ontouchstart = (e)=>e.preventDefault();
});
input.addEventListener("input", ()=>{
  // allow digits, dot, minus, and new lines
  let cleaned = input.value
    .replace(/[^\d.\-\n]/g, "")   // remove everything else
    .replace(/(\..*)\./g, "$1");  // only one dot per line (basic)

  input.value = cleaned;                    //input.addEventListener("input", run); 
  run();
});


function saveHistory(i,o){
  if(!i.trim()) return;

  let h = JSON.parse(localStorage.getItem('hist')||'[]');
  h.unshift({i,o,from,to});
  h = h.slice(0,10);

  localStorage.setItem('hist', JSON.stringify(h));
  renderHistory();
}

function renderHistory(){
  const h = JSON.parse(localStorage.getItem('hist')||'[]');

  historyDiv.innerHTML = h.map((x,idx)=>`
    <div data-i="${idx}" style="cursor:pointer;">
      ${currencyData[x.from]} → ${currencyData[x.to]} | ${x.i} = ${x.o}
    </div>
  `).join('');

  [...historyDiv.children].forEach((el,idx)=>{
    el.onclick = ()=>{
      const item = h[idx];

      from = item.from;
      to = item.to;
      input.value = item.i;

      updateActive();
      run();
      input.focus();
    };
  });
}

// auto refresh every 10 min
setInterval(async ()=>{
  await loadRates();
  run();
}, 600000);

// init
loadRates().then(()=>{
  createButtons(leftDiv,"left");
  createButtons(rightDiv,"right");
  renderHistory();
  input.focus();
});

//btn transform fix
document.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('touchstart', ()=>btn.classList.add('pressed'));
  btn.addEventListener('touchend', ()=>btn.classList.remove('pressed'));

  btn.addEventListener('mousedown', ()=>btn.classList.add('pressed'));
  btn.addEventListener('mouseup', ()=>btn.classList.remove('pressed'));
  btn.addEventListener('mouseleave', ()=>btn.classList.remove('pressed'));
});


async function pasteInput(){
  try {
    const text = await navigator.clipboard.readText();
    input.value = text;
    run();
    input.focus();
  } catch(e){
    // fallback for restricted browsers
    alert("Paste not allowed. Use long-press → Paste.");
  }
}

document.getElementById("kbBtn").addEventListener("click", ()=>{
  input.focus();
});
</script>
</body>
</html>
