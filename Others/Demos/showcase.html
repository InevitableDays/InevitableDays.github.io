<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Showcase</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  margin: 0;
  background:
    radial-gradient(circle at 20% 30%, #3b82f6 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, #a855f7 0%, transparent 40%),
    #050505;
  color: white;
}

/* GLASS */
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* PARALLAX */
.card {
  transform-style: preserve-3d;
  transition: transform 0.2s ease;
}

/* GLOW */
.glow::before {
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:18px;
  background: var(--accent, linear-gradient(120deg,#3b82f6,#a855f7));
  filter: blur(30px);
  opacity:0;
  transition:0.3s;
  z-index:-1;
}
.glow:hover::before {
  opacity:0.7;
}

/* MODAL ANIMATION */
@keyframes fadeZoom {
  from { opacity:0; transform:scale(0.9); }
  to { opacity:1; transform:scale(1); }
}
.animate-in {
  animation: fadeZoom 0.25s ease;
}


/* trying mobile again */

@media (max-width: 900px) {

  /* FORCE vertical stacking (1 → 2 → 3 → 4) */
  .grid {
    display: flex !important;
    flex-direction: column !important;
    gap: 16px !important;
    padding: 0 14px !important;
  }

  /* Each card full width */
  .card {
    width: 100% !important;
  }

  /* Remove desktop hover/parallax (feels broken on mobile) */
  .card {
    transform: none !important;
  }

  .glow::before {
    display: none !important;
  }

  /* Make previews look better on phones */
  .card iframe {
    height: 180px !important;
  }

  /* Header tighter */
  header {
    padding: 20px 0 !important;
    font-size: 22px !important;
  }

  /* Reduce bottom spacing so list isn’t floating */
  .grid {
    padding-bottom: 40px !important;
  }

  /* container spacing */
  div[style*="text-align:center"] {
    margin: 20px 0 80px 0 !important;
  }

  /* title */
  div[style*="letter-spacing:2px"] {
    font-size: 18px !important;
    margin-bottom: 25px !important;
  }

  /* links wrapper */
  div[style*="justify-content:center"] {
    gap: 20px !important;
    font-size: 18px !important;
    flex-direction: column !important;
    align-items: center;
  }

  /* links themselves */
  div[style*="justify-content:center"] a {
    padding: 10px 0;
    display: block;
    width: 100%;
    max-width: 220px;
  }

}
</style>
</head>

<body class="min-h-screen font-sans">

<header class="text-center py-10 text-3xl font-medium">
  Showcase
</header>

<div class="grid md:grid-cols-2 gap-10 px-10 pb-20 max-w-7xl mx-auto">

  <div class="relative glow card cursor-pointer"
    onclick="openPreview(0)">
    <div class="glass rounded-2xl overflow-hidden">
      <iframe src="https://inevitabledays.github.io/Others/Demos/forum"
        class="w-full h-60 pointer-events-none"></iframe>
      <div class="p-5"><div class="text-xl">Forum</div></div>
    </div>
  </div>

  <div class="relative glow card cursor-pointer"
    onclick="openPreview(1)">
    <div class="glass rounded-2xl overflow-hidden">
      <iframe src="https://inevitabledays.github.io/Others/Demos/streaming"
        class="w-full h-60 pointer-events-none"></iframe>
      <div class="p-5"><div class="text-xl">Streaming</div></div>
    </div>
  </div>

  <div class="relative glow card cursor-pointer"
    onclick="openPreview(2)">
    <div class="glass rounded-2xl overflow-hidden">
      <iframe src="https://inevitabledays.github.io/Others/Demos/shop"
        class="w-full h-60 pointer-events-none"></iframe>
      <div class="p-5"><div class="text-xl">Shop</div></div>
    </div>
  </div>

  <div class="relative glow card cursor-pointer"
    onclick="openPreview(3)">
    <div class="glass rounded-2xl overflow-hidden">
      <iframe src="https://inevitabledays.github.io/Others/Demos/socialmedia"
        class="w-full h-60 pointer-events-none"></iframe>
      <div class="p-5"><div class="text-xl">Social</div></div>
    </div>
  </div>

</div>

<!-- FLOATING CONTROLS -->
<div id="controls"
  class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex gap-3 glass px-3 py-2 rounded-xl">

  <button onclick="prev()" class="px-6">Previous</button>
  <button onclick="closePreview()" class="px-6">✕</button>
  <button onclick="next()" class="px-6">Next</button>

</div>

<!-- OVERLAY -->
<div id="overlay"
  class="fixed inset-0 hidden z-40 flex items-center justify-center bg-black/40 backdrop-blur-xl">

  <div id="modal"
    class="w-[90vw] h-[90vh] glass rounded-2xl overflow-hidden relative animate-in shadow-2xl">

    <iframe id="frame" class="w-full h-full"></iframe>

  </div>

</div>


<div style="text-align:center; margin:5px 0 120px 0;">

  <div style="font-size:14px; opacity:0.5; margin-bottom:20px; letter-spacing:2px;">
    DIRECT ACCESS
  </div>

  <div style="display:flex; justify-content:center; gap:30px; flex-wrap:wrap; font-size:16px;">

    <a href="https://inevitabledays.github.io/Others/Demos/forum"
       target="_blank"
       style="opacity:0.7; text-decoration:none; transition:0.2s;"
       onmouseover="this.style.opacity='1'"
       onmouseout="this.style.opacity='0.7'">
       Forum
    </a>

    <a href="https://inevitabledays.github.io/Others/Demos/streaming"
       target="_blank"
       style="opacity:0.7; text-decoration:none; transition:0.2s;"
       onmouseover="this.style.opacity='1'"
       onmouseout="this.style.opacity='0.7'">
       Streaming
    </a>

    <a href="https://inevitabledays.github.io/Others/Demos/shop"
       target="_blank"
       style="opacity:0.7; text-decoration:none; transition:0.2s;"
       onmouseover="this.style.opacity='1'"
       onmouseout="this.style.opacity='0.7'">
       Shop
    </a>

    <a href="https://inevitabledays.github.io/Others/Demos/socialmedia"
       target="_blank"
       style="opacity:0.7; text-decoration:none; transition:0.2s;"
       onmouseover="this.style.opacity='1'"
       onmouseout="this.style.opacity='0.7'">
       Social
    </a>

  </div>

</div>
<script>
const projects = [
  "https://inevitabledays.github.io/Others/Demos/forum",
  "https://inevitabledays.github.io/Others/Demos/streaming",
  "https://inevitabledays.github.io/Others/Demos/shop",
  "https://inevitabledays.github.io/Others/Demos/socialmedia"
];

let current = 0;

/* OPEN */
function openPreview(index) {
  current = index;

  document.getElementById("overlay").classList.remove("hidden");
  document.getElementById("controls").classList.remove("hidden");
  document.getElementById("frame").src = projects[index];

  history.pushState({ preview: true }, "");
}

/* CLOSE */
function closePreview() {
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("controls").classList.add("hidden");
  document.getElementById("frame").src = "";

  if (history.state && history.state.preview) {
    history.back();
  }
}

/* NAV */
function next() {
  current = (current + 1) % projects.length;
  document.getElementById("frame").src = projects[current];
}

function prev() {
  current = (current - 1 + projects.length) % projects.length;
  document.getElementById("frame").src = projects[current];
}

/* PARALLAX */
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("mousemove", e => {
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;

    card.style.transform = `rotateY(${x*10}deg) rotateX(${-y*10}deg)`;
  });

  card.addEventListener("mouseleave", () => {
    card.style.transform = `rotateY(0deg) rotateX(0deg)`;
  });
});

/* KEYS */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closePreview();
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
});
</script>
<script>
const overlayEl = document.getElementById("overlay");
const modalEl = document.getElementById("modal");

overlayEl.addEventListener("click", (e) => {
  // close only if the click is outside the modal panel
  if (!modalEl.contains(e.target)) {
    closePreview();
  }
});

window.addEventListener("popstate", () => {
  const overlay = document.getElementById("overlay");

  if (!overlay.classList.contains("hidden")) {
    overlay.classList.add("hidden");
    document.getElementById("controls").classList.add("hidden");
    document.getElementById("frame").src = "";
  }
});
</script>
</body>
</html>
