html, body {

/* DESKTOP */
#desktop {

    * {

<script>
let z = 1;
const openApps = {};

/* WINDOW SYSTEM */
function openWindow(title) {

  if (openApps[title]) {
    const w = openApps[title];
    w.style.display = "block";
    w.style.zIndex = ++z;
    return;
  }

  const win = document.createElement("div");
  win.className = "window";
const offset = Object.keys(openApps).length * 50;

win.style.top = (80 + offset) + "px";
win.style.left = (120 + offset) + "px";
  win.style.zIndex = ++z;

  let content = "";

  if (title === "Internet Explorer") {
    content = `
      <div class="ie6">

        <div class="ie6-menubar">
          <div>File</div><div>Edit</div><div>View</div>
          <div>Favorites</div><div>Tools</div><div>Help</div>
        </div>

        <div class="ie6-toolbar">
          <div class="ie6-btn">←</div>
          <div class="ie6-btn">→</div>
          <div class="ie6-btn">⟳</div>

          <div class="ie6-address">
            <span>Address</span>
            <input class="ie6-input" id="ie-url" value="http://wiby.me">
            <div class="ie6-btn" onclick="go(this)">Go</div>
          </div>
        </div>

        <iframe class="ie6-frame" src="http://wiby.me">sandbox="allow-scripts allow-forms allow-same-origin"</iframe>
        <div class="ie6-status">Done</div>
      </div>
    `;
  }

else if (title === "My Files") {
  content = `
    <div class="img-wrap">
      <img class="app-img" src="myfiles.png">
      <div class="hotspot1"></div>
    </div>
  `;
}
  else if (title === "This Computer") {
  content = `
    <div class="img-wrap">
      <img class="app-img" src="computer.png">
      <div class="hotspot1"></div>
    </div>
  `;
}
  else if (title === "Command Center") {
  content = `
    <div class="img-wrap">
      <img class="app-img" src="command.png">
      <div class="hotspot2"></div>
    </div>
  `;
}
  else if (title === "Trash Bin") {
  content = `
    <div class="img-wrap">
      <img class="app-img" src="trash.png">
      <div class="hotspot3"></div>
    </div>
  `;
}

  win.innerHTML = content;
  win.dataset.hasClose = "true";                         // test

  document.getElementById("desktop").appendChild(win);

  makeDraggable(win);
  addTaskbarItem(title, win);
  openApps[title] = win;
}

/* DRAG */
function makeDraggable(win) {
  let drag = false;
  let ox = 0, oy = 0;

  win.addEventListener("mousedown", (e) => {
    drag = true;
    ox = e.clientX - win.offsetLeft;
    oy = e.clientY - win.offsetTop;
    win.style.zIndex = ++z;
  });

  document.addEventListener("mousemove", (e) => {
    if (!drag) return;
    win.style.left = (e.clientX - ox) + "px";
    win.style.top = (e.clientY - oy) + "px";
  });

  document.addEventListener("mouseup", () => {
    drag = false;
  });
}

/* TASKBAR */
function addTaskbarItem(title, win) {
  const item = document.createElement("div");
  item.className = "task-item";
  item.innerText = title;
  item.onclick = () => {
    win.style.display = win.style.display === "none" ? "block" : "none";
  };

  document.getElementById("taskbar-icons").appendChild(item);
  win._taskItem = item;
}

/* IE6 NAV */
function go(btn) {
  const input = document.getElementById("ie-url");
  const frame = btn.closest(".ie6").querySelector("iframe");

  let url = input.value;
  if (!url.startsWith("http")) url = "https://" + url;

  frame.src = url;
}

/* CLOCK */
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" +
    String(d.getMinutes()).padStart(2, "0");
}, 1000);





function lockFrame(frame) {
  frame.addEventListener("load", () => {
    try {
      const doc = frame.contentDocument; 
      if (!doc) return;

      doc.querySelectorAll("a").forEach(a => {
        a.target = "_self";
      });
    } catch {}
  });
}


const zone=document.getElementById("hotcorner");
const menu=document.getElementById("startMenu");

let open=false;

/* TOGGLE */
zone.addEventListener("click",(e)=>{
  e.stopPropagation();

  open = !open;
  menu.style.display = open ? "block" : "none";
});

/* disengage after clicking elsewhere */
document.addEventListener("click",()=>{
  if(!open) return;
  open = false;
  menu.style.display = "none";
});






document.addEventListener("click", (e) => {
  const win = e.target.closest(".window");
  if (!win) return;

  const rect = win.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  // top-right "X zone"
  const closeSize = 25;

if (x > rect.width - closeSize && y < closeSize) {

  if (win._taskItem) win._taskItem.remove(); // <-- REMOVE TASKBAR BUTTON

  for (const key in openApps) {
    if (openApps[key] === win) {
      delete openApps[key];
      break;
    }
  }

  win.remove();
}
});


(function () {
  document.addEventListener("mousedown", (e) => {
    const win = e.target.closest(".window");
    if (win) {
      win.style.zIndex = ++z;
      return;
    }

    const task = e.target.closest(".task-item");
    if (task && task.dataset.winId) {
      const winRef = openApps[task.dataset.winId];
      if (winRef) {
        winRef.style.display = "block";
        winRef.style.zIndex = ++z;
      }
    }
  });
})();

      <button id="applyBtn">Apply</button>
    </div>
  `;

  document.body.appendChild(win);

  const desktop = document.getElementById("desktop");

    desktop.style.backgroundImage = `url(${url})`;
    desktop.style.backgroundSize = "cover";

  };

  win.querySelector("#closeBtn").onclick = () => {
    win.remove();
  };

  // drag
  const bar = win.querySelector(".titlebar");
  bar.addEventListener("mousedown", (e) => {
    const rect = win.getBoundingClientRect();
    const ox = e.clientX - rect.left;
    const oy = e.clientY - rect.top;

    function move(ev) {
      win.style.left = ev.clientX - ox + "px";
      win.style.top = ev.clientY - oy + "px";
    }

    function stop() {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", stop);
    }

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", stop);
  });
}













(function () {
  const desktop = document.getElementById("desktop");

  const menu = document.createElement("div");
  menu.style.position = "fixed";
  menu.style.display = "none";
  menu.style.zIndex = "99999";
  menu.style.width = "120px";
  menu.style.background = "#f5f5f5";
  menu.style.border = "1px solid #0a246a";
  menu.style.boxShadow = "2px 2px 6px rgba(0,0,0,0.3)";
  menu.style.fontSize = "12px";
  menu.style.padding = "2px 0";

  function item(text, action, isFaint = false) {
    const el = document.createElement("div");
    el.textContent = text;
    el.style.padding = "6px 10px";
    el.style.cursor = "default";
    el.style.color = "black";

    if (isFaint) el.style.color = "#7a7a7a";

    el.onmouseover = () => {
      el.style.background = "#316ac5";
      el.style.color = "white";
    };

    el.onmouseout = () => {
      el.style.background = "transparent";
      el.style.color = isFaint ? "#7a7a7a" : "black";
    };

    el.onclick = () => {
      menu.style.display = "none";
      action && action();
    };

    return el;
  }


  menu.appendChild(item("Arrange Icons By"));
  menu.appendChild(item("New"));

  menu.appendChild(item("Refresh", () => {
    document.querySelectorAll(".window").forEach(w => w.style.zIndex = 1);
  }));

  menu.appendChild(item("Paste", null, true));
  menu.appendChild(item("Create Shortcut", null, true));

  menu.appendChild(item("Properties", openWallpaperWindow));

  document.body.appendChild(menu);

  desktop.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    menu.style.left = e.clientX + "px";
    menu.style.top = e.clientY + "px";
    menu.style.display = "block";
  });

  document.addEventListener("click", () => {
    menu.style.display = "none";
  });
})();

let stage = "boot";

function startBoot() {
  const boot = document.getElementById("boot");
  const gif = document.getElementById("bootGif");
  const login = document.getElementById("loginScreen");
  const welcome = document.getElementById("welcome");
  const desktop = document.getElementById("desktop");

  const audio = new Audio("startup.wav");

  // initial state
  boot.style.display = "block";
  gif.style.display = "block";
  login.style.display = "none";
  welcome.style.display = "none";
  desktop.style.display = "none";

  // stage 1 → boot gif
  setTimeout(() => {
    gif.style.display = "none";
    login.style.display = "block";
    stage = "login";
  }, 2000);

  function proceed() {
    if (stage !== "login") return;
    stage = "welcome";

    login.style.display = "none";
    welcome.style.display = "block";

    audio.play().catch(() => {});

    // short delay before desktop
    setTimeout(() => {
      welcome.style.display = "none";
      boot.style.display = "none";
      desktop.style.display = "block";

      cleanup();
    }, 1000);
  }

  function keyHandler(e) {
    if (e.key === "Enter") proceed();
  }

  function clickHandler() {
    proceed();
  }

  function cleanup() {
    document.removeEventListener("keydown", keyHandler);
    document.removeEventListener("click", clickHandler);
  }

  document.addEventListener("keydown", keyHandler);
  document.addEventListener("click", clickHandler);
}


// ss
const layer = document.getElementById("screensaverLayer");
const saver = document.getElementById("screensaver");

let saverActive = false;
let saverTimer;

function startScreensaver() {
  if (saverActive) return;
  saverActive = true;

  layer.style.display = "block";

  function moveLogo() {
    if (!saverActive) return;

    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 120);

    saver.style.left = x + "px";
    saver.style.top = y + "px";

    saver.style.opacity = Math.random() * 0.7 + 0.3;

    setTimeout(moveLogo, 1500);
  }

  moveLogo();
}

function stopScreensaver() {
  saverActive = false;
  layer.style.display = "none";
}

function resetScreensaverTimer() {
  clearTimeout(saverTimer);
  stopScreensaver();

  saverTimer = setTimeout(startScreensaver, 60000);
}

document.addEventListener("mousemove", resetScreensaverTimer);
document.addEventListener("keydown", resetScreensaverTimer);
document.addEventListener("click", resetScreensaverTimer);

resetScreensaverTimer();
