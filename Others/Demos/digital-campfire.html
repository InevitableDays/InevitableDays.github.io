<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Campfire</title>
<style>
:root{--bg:#090706;--ember:#ff9b54;--gold:#ffd28a;--smoke:#d7c6b3;--muted:#88796d;--panel:rgba(22,15,11,.68);--line:rgba(255,210,138,.13)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f3e7d7;font-family:Georgia,serif}button{font:inherit;color:inherit}#app{position:relative;width:100%;height:100%;isolation:isolate;background:radial-gradient(circle at 50% 75%,#32180d 0,#160c08 28%,#090706 66%)}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}.grain{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}.top{position:absolute;top:28px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;z-index:3}.brand{letter-spacing:.18em;text-transform:uppercase;font:11px/1.2 Arial,sans-serif;color:#b9a493}.brand b{color:#ffd49b;font-weight:500}.clock{font:11px Arial,sans-serif;color:#827267;letter-spacing:.12em}.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.scene{position:relative;width:min(650px,90vw);height:min(600px,78vh);display:flex;align-items:flex-end;justify-content:center}.moon{position:absolute;top:4%;right:10%;width:74px;height:74px;border-radius:50%;background:#eadfca;box-shadow:0 0 55px rgba(234,223,202,.16);opacity:.7}.moon:after{content:"";position:absolute;width:66px;height:66px;border-radius:50%;background:#0b0807;left:15px;top:-7px}.halo{position:absolute;bottom:14%;width:360px;height:150px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,123,39,.32),rgba(255,84,20,.12) 42%,transparent 70%);filter:blur(12px);animation:pulse 3.2s ease-in-out infinite}.fire{position:absolute;bottom:14%;width:190px;height:260px;filter:drop-shadow(0 0 30px rgba(255,107,32,.35));animation:fire 1.8s ease-in-out infinite alternate}.flame{position:absolute;bottom:0;left:50%;transform-origin:50% 100%;border-radius:55% 45% 55% 45%;mix-blend-mode:screen}.f1{width:120px;height:205px;margin-left:-60px;background:linear-gradient(#ffdf8c,#ff8c35 48%,#ed421e);transform:rotate(2deg);animation:flicker .8s infinite alternate}.f2{width:85px;height:160px;margin-left:-42px;background:linear-gradient(#fff0ad,#ffb23f 50%,#f04b22);animation:flicker .58s infinite alternate-reverse}.f3{width:45px;height:105px;margin-left:-22px;background:#fff0bb;filter:blur(1px);animation:flicker .42s infinite alternate}.flame:after{content:"";position:absolute;inset:25% 20% 8%;background:rgba(255,255,220,.65);border-radius:50%;filter:blur(9px)}.logs{position:absolute;bottom:11%;width:250px;height:38px}.log{position:absolute;width:145px;height:25px;background:linear-gradient(#5c2b18,#32160e);border:1px solid #71361e;border-radius:15px;box-shadow:0 8px 12px #030202}.log:nth-child(1){transform:rotate(10deg);left:12px}.log:nth-child(2){transform:rotate(-12deg);right:12px}.log:nth-child(3){width:120px;left:64px;bottom:7px;transform:rotate(2deg)}.ground{position:absolute;bottom:9%;width:530px;height:45px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.8),transparent 68%)}.title{position:absolute;top:5%;left:50%;transform:translateX(-50%);text-align:center;width:100%;pointer-events:none}.title h1{font-size:clamp(42px,7vw,78px);font-weight:400;letter-spacing:-.045em;margin:0;color:#f5e4cf;text-shadow:0 3px 30px #000}.title p{font:11px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#9c8877;margin-top:10px}.panel{position:absolute;left:28px;bottom:28px;width:min(310px,calc(100vw - 56px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(14px);z-index:4;box-shadow:0 20px 60px rgba(0,0,0,.3)}.row{display:flex;gap:7px;align-items:center}.row+.row{margin-top:10px}.btn{border:1px solid var(--line);background:rgba(255,220,170,.035);border-radius:10px;padding:9px 11px;cursor:pointer;font:11px Arial,sans-serif;letter-spacing:.06em;transition:.2s}.btn:hover,.btn.active{background:rgba(255,177,94,.12);border-color:rgba(255,210,138,.3)}.grow{flex:1}.label{font:10px Arial,sans-serif;text-transform:uppercase;letter-spacing:.15em;color:#806f61;margin-bottom:8px}.range{width:100%;accent-color:#e8954b}.duration{font:22px Georgia,serif;color:#f3d0a5;min-width:55px}.prompt{position:absolute;right:28px;bottom:28px;width:min(350px,calc(100vw - 56px));padding:20px;border-left:1px solid rgba(255,184,111,.2);z-index:4;opacity:0;transform:translateY(12px);transition:.35s;pointer-events:none}.prompt.show{opacity:1;transform:none}.prompt .small{font:9px Arial,sans-serif;text-transform:uppercase;letter-spacing:.18em;color:#896f5c}.prompt p{font-size:19px;line-height:1.45;color:#d8c5b2;margin:9px 0 0}.story{position:absolute;top:50%;left:50%;transform:translate(-50%,-45%);width:min(450px,82vw);text-align:center;opacity:0;pointer-events:none;transition:.5s;z-index:5}.story.show{opacity:1}.story p{font-size:20px;line-height:1.65;color:#d9c7b4}.story button{pointer-events:auto}.breath{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:180px;height:180px;border:1px solid rgba(255,207,157,.28);border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.4s;z-index:5}.breath.show{opacity:1}.breath:before{content:"";position:absolute;inset:20px;border-radius:50%;background:rgba(255,145,65,.08);box-shadow:0 0 50px rgba(255,125,42,.1);animation:breathe 8s ease-in-out infinite}.breath span{z-index:1;font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c7ad96}.status{position:absolute;right:28px;top:28px;z-index:4;font:9px Arial,sans-serif;color:#78685d;letter-spacing:.12em;text-transform:uppercase}.fade{position:absolute;inset:0;background:#050302;opacity:0;pointer-events:none;z-index:10;transition:1.5s}.fade.on{opacity:.72}@keyframes flicker{0%{transform:rotate(-4deg) scale(.96,.98)}50%{transform:rotate(3deg) scale(1.03,1.01)}100%{transform:rotate(-2deg) scale(.98,1.05)}}@keyframes fire{to{transform:scale(1.03,.98)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.8}}@keyframes breathe{0%,100%{transform:scale(.72)}50%{transform:scale(1.22)}}@media(max-width:700px){.top{left:18px;right:18px;top:18px}.clock{display:none}.title{top:11%}.scene{height:62vh}.moon{right:3%;top:2%;width:50px;height:50px}.moon:after{width:44px;height:44px}.fire{transform:scale(.75);bottom:18%}.logs{transform:scale(.75);bottom:15%}.ground{bottom:13%;width:360px}.panel{left:16px;bottom:16px;width:calc(100vw - 32px)}.prompt{right:16px;bottom:145px;width:calc(100vw - 32px);text-align:center;border-left:0;padding:12px}.status{right:16px;top:58px}}
</style></head>
<body><main id="app"><canvas id="sky"></canvas><div class="grain"></div><header class="top"><div class="brand"><b>Digital</b> Campfire</div><div class="clock" id="clock"></div></header><div class="status" id="status">quiet night · embers drifting</div><section class="center"><div class="scene"><div class="title"><h1>Stay awhile.</h1><p>nothing to solve · nowhere to be</p></div><div class="moon"></div><div class="halo"></div><div class="ground"></div><div class="logs"><i class="log"></i><i class="log"></i><i class="log"></i></div><div class="fire"><i class="flame f1"></i><i class="flame f2"></i><i class="flame f3"></i></div></div></section><div class="panel"><div class="label">Campfire length</div><div class="row"><span class="duration" id="duration">15 min</span><input id="range" class="range grow" type="range" min="5" max="60" step="5" value="15"></div><div class="row"><button class="btn active" id="sound">Sound off</button><button class="btn" id="promptBtn">Prompt</button><button class="btn" id="storyBtn">Story</button><button class="btn" id="breathBtn">Breathe</button></div></div><div class="prompt" id="prompt"><div class="small">A question for the fire</div><p id="promptText"></p></div><div class="story" id="story"><p id="storyText"></p><button class="btn" id="closeStory">let it fade</button></div><div class="breath" id="breath"><span id="breathText">inhale</span></div><div class="fade" id="fade"></div></main>
<script>
const $=id=>document.getElementById(id); const canvas=$('sky'),ctx=canvas.getContext('2d'); let W,H,dpr,stars=[],sparks=[],soundOn=false,audioCtx,gain,wind,noise;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H*.72,r:Math.random()*1.25+.15,a:Math.random()*.7+.15,t:Math.random()*8}))}addEventListener('resize',resize);resize();
const prompts=["What part of today would you keep, if you could keep only one moment?","What are you quietly becoming?","What feels ordinary now that once felt impossible?","If nobody needed anything from you tonight, what would you do?","What deserves more of your attention than it currently gets?","What is something you understand now that you didn't a year ago?","Which memory still has a smell attached to it?","What would you tell your younger self without trying to fix anything?","Where does your mind go when it finally gets quiet?","What small thing has been making life better lately?"];
const stories=["A traveler once carried a match across a whole winter, not because they needed fire, but because knowing they had it made the cold feel less absolute.","There was a house at the edge of a forest where every window faced the trees. The people who lived there learned to measure time by shadows instead of clocks.","Someone left a chair beside an old fire one night. By morning, no one remembered who had placed it there. They kept it anyway.","A tiny star was visible only when nobody was looking directly at it. So the village learned to sit together and look slightly away."];
function draw(t){ctx.clearRect(0,0,W,H);const grad=ctx.createRadialGradient(W*.5,H*.72,20,W*.5,H*.72,Math.min(W,H)*.65);grad.addColorStop(0,'rgba(255,112,38,.07)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);stars.forEach(s=>{let a=s.a*(.65+.35*Math.sin(t*.001+s.t));ctx.fillStyle=`rgba(245,221,188,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}); if(Math.random()<.28)sparks.push({x:W*.5+(Math.random()-.5)*70,y:H*.66+Math.random()*25,vx:(Math.random()-.5)*.7,vy:-Math.random()*1.8-0.5,l:1});sparks=sparks.filter(s=>s.l>0);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.008;s.l-=.012;ctx.fillStyle=`rgba(255,${130+Math.random()*90},70,${s.l})`;ctx.shadowBlur=8;ctx.shadowColor='#ff8b3d';ctx.beginPath();ctx.arc(s.x,s.y,Math.random()*1.8+.5,0,7);ctx.fill()});requestAnimationFrame(draw)}requestAnimationFrame(draw);
$('range').oninput=e=>$('duration').textContent=e.target.value+' min';
$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),30000);
function showPrompt(){let p=prompts[Math.floor(Math.random()*prompts.length)];$('promptText').textContent=p;$('prompt').classList.add('show');setTimeout(()=>$('prompt').classList.remove('show'),12000)}$('promptBtn').onclick=showPrompt;
$('storyBtn').onclick=()=>{$('storyText').textContent=stories[Math.floor(Math.random()*stories.length)];$('story').classList.add('show')};$('closeStory').onclick=()=>$('story').classList.remove('show');
let timer;function startBreath(){ $('breath').classList.add('show');let phase=0;clearInterval(timer);timer=setInterval(()=>{phase++;$('breathText').textContent=phase%2?'exhale':'inhale'},4000);setTimeout(()=>{$('breath').classList.remove('show');clearInterval(timer)},40000)}$('breathBtn').onclick=startBreath;
function startAudio(){audioCtx=new (window.AudioContext||window.webkitAudioContext)();gain=audioCtx.createGain();gain.gain.value=.035;gain.connect(audioCtx.destination);let o=audioCtx.createOscillator();o.type='sine';o.frequency.value=74;let g=audioCtx.createGain();g.gain.value=.18;o.connect(g);g.connect(gain);o.start();noise=audioCtx.createBufferSource();let b=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise.buffer=b;noise.loop=true;let nf=audioCtx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=900;let ng=audioCtx.createGain();ng.gain.value=.018;noise.connect(nf);nf.connect(ng);ng.connect(gain);noise.start();wind=o}function toggleSound(){if(!soundOn){startAudio();soundOn=true;$('sound').textContent='Sound on';$('sound').classList.add('active')}else{gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+1);setTimeout(()=>{audioCtx.close()},1100);soundOn=false;$('sound').textContent='Sound off';$('sound').classList.remove('active')}}$('sound').onclick=toggleSound;
let duration=15;function campfireTimer(){duration=+$('range').value;$('status').textContent='the fire will stay with you · '+duration+' min';$('fade').classList.remove('on');setTimeout(()=>{$('fade').classList.add('on');$('status').textContent='the fire is quiet now · goodnight'},duration*60000)}$('range').addEventListener('change',campfireTimer);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();showPrompt()} if(e.key.toLowerCase()==='b')startBreath();if(e.key.toLowerCase()==='s')toggleSound()});
</script></body></html>
