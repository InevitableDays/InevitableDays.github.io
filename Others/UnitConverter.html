<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Converters</title>
<link rel="preload" as="image" href="https://InevitableDays.github.io/Others/SS/bg/bg6.jpg">
<style>
body { font-family: system-ui, sans-serif; margin:0; padding:0 12px; background:url('https://InevitableDays.github.io/Others/SS/bg/bg6.jpg') no-repeat center/cover fixed; color:#e2e8f0; background-color: #266485; }
header { padding:20px; text-align:center; font-size:30px; font-weight:700; }
.container { display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:1000px; margin:auto; }
textarea { width:100%; height:260px; background:rgba(2,6,23,0.7); backdrop-filter:blur(6px); color:#e2e8f0; border:1px solid #1e293b; padding:10px; border-radius:8px; }
.controls { display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px; }
button { background:#1e293b; color:#e2e8f0; border:none; padding:10px 14px; border-radius:8px; cursor:pointer; }
button:hover { box-shadow:0 0 14px rgba(255,140,0,0.8); }
button:active { transform: scale(0.96); box-shadow: 0 0 6px rgba(251,146,60,0.6); }
select { padding:8px; border-radius:6px; background:#020617; color:#fff; border:1px solid #1e293b; }
.history { max-width:1000px; margin:10px auto; font-size:14px; opacity:0.8; }
.label { max-width:1000px; margin:8px auto 0; display:grid; grid-template-columns:1fr 1fr; gap:24px; font-size:13px; opacity:0.8; }
@media (max-width: 900px) {
  body {
    padding: 0 8px;
  }

  .container {
    grid-template-columns: 1fr;
    max-width: 100%;
    margin: 0;
    gap: 12px;
  }
  .label {
    grid-template-columns: 1fr;
    gap: 6px;
    text-align: left;
    padding: 0 2px;
  }
  textarea {
    height: 140px;
    width: 100%;
    box-sizing: border-box;
  }
}
</style>
</head>
<body>
<header>Unit Converters</header>

<div class="controls">
<select id="unitType">
<option value="cm-in">Centimeter (cm) ↔ Inches (in)</option>
<option value="c-f">Celcius (°C) ↔ Fahrenheit (°F)</option>
<option value="kg-lbs">Pounds (lbs) ↔ Kilograms (kg)</option>
<option value="m-ft">Meter (m) ↔ Feet (ft)</option>
<option value="mi-km">Mile (mi) ↔ Kilometer (km)</option>
</select>
<div>
<button onclick="swap()">↔ Swap</button>
<button onclick="clearAll()">Clear</button>
<button onclick="copyOutput()">Copy Result</button>
</div>
</div>

<div class="label">
<div id="inputLabel"></div>
<div id="outputLabel"></div>
</div>

<div class="container">
<textarea id="input" placeholder="Enter value(s)..."></textarea>
<textarea id="output" placeholder="Result..."></textarea>
</div>

<div class="history" id="history"></div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const unitType = document.getElementById('unitType');
const inputLabel = document.getElementById('inputLabel');
const outputLabel = document.getElementById('outputLabel');
let reversed = false;

function labels(){
  switch(unitType.value){
    case 'cm-in': return reversed ? ['Input (in)','Output (cm)'] : ['Input (cm)','Output (in)'];
    case 'c-f': return reversed ? ['Input (°F)','Output (°C)'] : ['Input (°C)','Output (°F)'];
    case 'kg-lbs': return reversed ? ['Input (kg)','Output (lbs)'] : ['Input (lbs)','Output (kg)'];
    case 'm-ft': return reversed ? ['Input (ft)','Output (m)'] : ['Input (m)','Output (ft)'];
    case 'mi-km': return reversed ? ['Input (km)','Output (mi)'] : ['Input mi)','Output (km)'];
  }
}

function updateLabels(){
  const [i,o] = labels();
  inputLabel.textContent = i;
  outputLabel.textContent = o;
  input.placeholder = i.replace('Input','Enter');
}

function convert(val){
  const n = parseFloat(val);
  if(isNaN(n)) return 'invalid';

  switch(unitType.value){
    case 'cm-in': return reversed ? (n*2.54).toFixed(2)+' cm' : (n/2.54).toFixed(2)+' in';
    case 'c-f': return reversed ? ((n-32)*5/9).toFixed(2)+' °C' : (n*9/5+32).toFixed(2)+' °F';
    case 'kg-lbs': return reversed ? (n/0.453592).toFixed(2)+' lbs' : (n*0.453592).toFixed(2)+' kg';
    case 'm-ft': return reversed  ? (n * 0.3048).toFixed(2) + ' m'  : (n * 3.28084).toFixed(2) + ' ft';
    case 'mi-km': return reversed ? (n/0.621371).toFixed(2)+' mi' : (n*0.621371).toFixed(2)+' km';
  }
}

function run(){
  const lines = input.value.split('\n');
  const results = lines.map(l=>convert(l));
  output.value = results.join('\n');
  saveHistory(input.value, output.value);
}

function swap(){ reversed = !reversed; updateLabels(); run(); }
function clearAll(){ input.value=''; output.value=''; }
function copyOutput(){ navigator.clipboard.writeText(output.value); }

input.addEventListener('input', run);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') setTimeout(run,0); });
unitType.addEventListener('change', ()=>{ reversed=false; updateLabels(); run(); });

function saveHistory(i,o){
  let h = JSON.parse(localStorage.getItem('hist')||'[]');
  h.unshift({i,o});
  h = h.slice(0,10);
  localStorage.setItem('hist', JSON.stringify(h));
  renderHistory();
}

function renderHistory(){
  const h = JSON.parse(localStorage.getItem('hist')||'[]');
  document.getElementById('history').innerHTML = h.map(x=>`<div>${x.i} = ${x.o}</div>`).join('');
}

updateLabels();
renderHistory();
</script>
</body>
</html>
