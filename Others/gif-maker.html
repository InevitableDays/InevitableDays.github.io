<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF Maker</title>
<style>
:root{--bg:#0e1118;--panel:#171c27;--ink:#eef1f7;--mute:#8993a8;--line:#2a3144;--acc:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(rgba(8,13,27,.68),rgba(8,13,27,.82)),url("https://images.unsplash.com/photo-1610568781018-995405522539?auto=format&fit=crop&w=2000&q=85") center/cover fixed no-repeat,linear-gradient(135deg,#0e1118,#1b2440);color:#f1f5ff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:940px;margin:0 auto;padding:28px 20px;display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start}
#left{width:min(420px,100%);flex:none}
#stage{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
#pv{position:absolute;inset:0;width:100%;height:100%}
#drop{z-index:2;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;background:var(--panel);border:2px dashed var(--line);border-radius:18px;color:var(--mute)}
#drop b{color:var(--ink);font-size:1.2rem;margin-bottom:4px}
#drop.over,#drop:focus-visible{border-color:var(--acc);outline:none}
#crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none;display:none}
#hd{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;background:var(--acc);border-radius:5px;cursor:nwse-resize}
#another{width:100%;margin-top:10px;font:inherit;padding:10px;border-radius:12px;border:1.5px dashed #34c759;background:rgba(52,199,89,.12);color:#7ee89b;cursor:pointer}
#another:hover{background:rgba(52,199,89,.22)}
.fmt{margin-top:4px;text-align:center;color:var(--mute);font-size:.85rem}
#thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tw{width:76px}
.tw input{width:100%;margin-top:4px;font:inherit;font-size:.78rem;padding:3px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
.th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th i{position:absolute;left:4px;top:2px;font:700 .7rem system-ui;font-style:normal;color:#fff;text-shadow:0 0 3px #000}
.th div{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(0,0,0,.65)}
.th button{flex:1;border:0;background:none;color:#fff;cursor:pointer;padding:2px 0;font:inherit;font-size:.8rem}
.th button:hover{background:var(--acc)}
#panel{flex:1 1 300px;max-width:440px}
h1{margin:0 0 22px;font-size:2rem;letter-spacing:-.03em}
.g{margin-bottom:20px}
.g p{margin:0 0 8px;color:var(--mute);font-weight:600;display:flex;justify-content:space-between}
.g p span{color:var(--ink);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;min-width:62px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.opts button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#go{width:100%;font:inherit;font-weight:800;font-size:1.1rem;padding:15px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffd740,#ffb300);color:#e65100;cursor:pointer;margin-top:6px;transition:transform .15s}
#go:hover:not(:disabled){transform:translateY(-1px)}
#go:disabled{opacity:.45;cursor:not-allowed}
#msg{margin-top:12px;color:var(--mute);min-height:1.5em}
#bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden;display:none}
#bar div{height:100%;width:0;background:var(--acc)}
#res{display:none;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
#res img{max-width:100%;border-radius:8px;display:block;margin:0 auto 10px}
#res a{display:inline-block;padding:10px 18px;border-radius:12px;background:#34c759;color:#04210d;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <div id="left">
    <div id="stage">
      <canvas id="pv" width="600" height="600"></canvas>
      <div id="crop"><div id="hd"></div></div>
      <div id="drop" tabindex="0" role="button"><b>Drop images here</b>or click to choose several</div>
      <input id="file" type="file" accept="image/*" multiple hidden>
    </div>
    <button id="another">Drop or choose more images</button>
    <div class="fmt">PNG, JPG, WebP, GIF, BMP · everything runs on your device</div>
    <div id="thumbs"></div>
  </div>
  <div id="panel">
    <h1>GIF Maker</h1>
    <div class="g"><p>Default delay per frame<span id="dl"></span></p><input type="range" id="delay" min="20" max="5000" step="10" value="100" aria-label="Delay"></div>
    <div class="g"><p>Crop<span id="info"></span></p><div class="opts" id="presets"></div></div>
    <div id="groups"></div>
    <button id="go" disabled>Create GIF</button>
    <div id="bar"><div></div></div>
    <div id="msg" role="status"></div>
    <div id="res"><img id="out" alt="Your GIF"><a id="dlk" download="animation.gif">Download GIF</a><div class="fmt" id="sz"></div></div>
  </div>
</main>

<script id="wk" type="text/plain">
onmessage=function(e){
var d=e.data,F=d.frames,w=d.w,h=d.h,N=d.colors,bits=Math.log2(N),q=d.q;
/* palette: median cut on 5-bit histogram */
var hist=new Uint32Array(32768),i,j,k;
F.forEach(function(buf){var p=new Uint8ClampedArray(buf);for(i=0;i<p.length;i+=4*q)hist[((p[i]>>3)<<10)|((p[i+1]>>3)<<5)|(p[i+2]>>3)]++});
var all=[];for(i=0;i<32768;i++)if(hist[i])all.push(i);
var ch=function(c,a){return a==0?c>>10:a==1?(c>>5)&31:c&31};
function range(b){var mn=[31,31,31],mx=[0,0,0];b.forEach(function(c){for(var a=0;a<3;a++){var v=ch(c,a);if(v<mn[a])mn[a]=v;if(v>mx[a])mx[a]=v}});var best=0,r=-1;for(var a=0;a<3;a++)if(mx[a]-mn[a]>r){r=mx[a]-mn[a];best=a}return[best,r]}
var boxes=[all.length?all:[0]];
while(boxes.length<N){var bi=-1,br=-1,ba=0;boxes.forEach(function(b,x){if(b.length>1){var r=range(b);if(r[1]*Math.sqrt(b.length)>br){br=r[1]*Math.sqrt(b.length);bi=x;ba=r[0]}}});if(bi<0)break;
 var b=boxes[bi];b.sort(function(x,y){return ch(x,ba)-ch(y,ba)});var tot=0;b.forEach(function(c){tot+=hist[c]});var acc=0,cut=1;for(i=0;i<b.length-1;i++){acc+=hist[b[i]];cut=i+1;if(acc>=tot/2)break}
 boxes.splice(bi,1,b.slice(0,cut),b.slice(cut))}
var pal=new Uint8Array(N*3);
boxes.forEach(function(b,x){var r=0,g=0,bl=0,t=0;b.forEach(function(c){var n=hist[c]||1;r+=(c>>10)*n;g+=((c>>5)&31)*n;bl+=(c&31)*n;t+=n});
 var s=function(v){v=Math.round(v/t);return(v<<3)|(v>>2)};pal[x*3]=s(r);pal[x*3+1]=s(g);pal[x*3+2]=s(bl)});
var np=boxes.length,cache=new Int16Array(32768).fill(-1);
function near(key){var c=cache[key];if(c>=0)return c;var r=((key>>10)<<3)|4,g=(((key>>5)&31)<<3)|4,b=((key&31)<<3)|4,bd=1e9,bx=0;
 for(var x=0;x<np;x++){var dr=r-pal[x*3],dg=g-pal[x*3+1],db=b-pal[x*3+2],dd=dr*dr*2+dg*dg*4+db*db*3;if(dd<bd){bd=dd;bx=x}}cache[key]=bx;return bx}
/* LZW */
function lzw(px,mc){var out=[],bi=0,nb=0,clear=1<<mc,eoi=clear+1,size=mc+1,next=eoi+1,dict=new Map();
 function emit(c,s){bi|=c<<nb;nb+=s;while(nb>=8){out.push(bi&255);bi>>>=8;nb-=8}}
 emit(clear,size);var pre=px[0];
 for(var i=1;i<px.length;i++){var k=px[i],key=(pre<<8)|k,c=dict.get(key);
  if(c!==undefined){pre=c}else{emit(pre,size);
   if(next===4096){emit(clear,size);dict.clear();next=eoi+1;size=mc+1}else{if(next>=(1<<size))size++;dict.set(key,next++)}
   pre=k}}
 emit(pre,size);emit(eoi,size);if(nb>0)out.push(bi&255);return out}
var parts=[],B=[];function pu(){for(var a=0;a<arguments.length;a++)B.push(arguments[a])}
function s(t){for(var a=0;a<t.length;a++)B.push(t.charCodeAt(a))}
s('GIF89a');pu(w&255,w>>8,h&255,h>>8,0xF0|(bits-1),0,0);for(i=0;i<N*3;i++)B.push(pal[i]);
if(d.loop!==-1){pu(0x21,0xFF,11);s('NETSCAPE2.0');pu(3,1,d.loop&255,d.loop>>8,0)}
var mc=Math.max(2,bits);
parts.push(new Uint8Array(B));
F.forEach(function(buf,fi){
 var p=new Uint8ClampedArray(buf),ix=new Uint8Array(w*h);
 if(d.dither){var cur=new Float32Array((w+2)*3),nxt=new Float32Array((w+2)*3),t;
  for(var y=0;y<h;y++){nxt.fill(0);for(var x=0;x<w;x++){var o=(y*w+x)*4,e=(x+1)*3,
    r=Math.min(255,Math.max(0,p[o]+cur[e])),g=Math.min(255,Math.max(0,p[o+1]+cur[e+1])),b=Math.min(255,Math.max(0,p[o+2]+cur[e+2])),
    id=near(((r>>3)<<10)|((g>>3)<<5)|(b>>3));ix[y*w+x]=id;
    var er=r-pal[id*3],eg=g-pal[id*3+1],eb=b-pal[id*3+2];
    cur[e+3]+=er*7/16;cur[e+4]+=eg*7/16;cur[e+5]+=eb*7/16;
    nxt[e-3]+=er*3/16;nxt[e-2]+=eg*3/16;nxt[e-1]+=eb*3/16;
    nxt[e]+=er*5/16;nxt[e+1]+=eg*5/16;nxt[e+2]+=eb*5/16;
    nxt[e+3]+=er/16;nxt[e+4]+=eg/16;nxt[e+5]+=eb/16}
   t=cur;cur=nxt;nxt=t}
 }else{for(i=0,j=0;i<p.length;i+=4,j++)ix[j]=near(((p[i]>>3)<<10)|((p[i+1]>>3)<<5)|(p[i+2]>>3))}
 var cs=Math.max(2,Math.round(d.delays[fi]/10)),H=[0x21,0xF9,4,0x04,cs&255,cs>>8,0,0,0x2C,0,0,0,0,w&255,w>>8,h&255,h>>8,0,mc],L=lzw(ix,mc),o2=[];
 for(i=0;i<L.length;i+=255){var n=Math.min(255,L.length-i);H.push(n);for(k=0;k<n;k++)H.push(L[i+k])}
 H.push(0);parts.push(new Uint8Array(H));postMessage({p:(fi+1)/F.length})});
parts.push(new Uint8Array([0x3B]));postMessage({done:parts})};
</script>

<script>
(function(){
const $=id=>document.getElementById(id);
const pv=$('pv'),pc=pv.getContext('2d'),stage=$('stage'),drop=$('drop'),file=$('file'),go=$('go'),msg=$('msg'),cropEl=$('crop');
const st={delay:100,loop:0,width:480,colors:256,dither:1,q:1,dir:0};
let imgs=[],BW=600,BH=600,crop={x:0,y:0,w:1,h:1},ratio=null,busy=false,fi=0,last=0,worker=null,outUrl=null;
const bc=document.createElement('canvas'),bx=bc.getContext('2d');

/* options */
const defs=[['Loop','loop',[['Forever',0],['Once',-1],['3×',3]]],
 ['Direction','dir',[['Forward',0],['Reverse',1],['Boomerang',2]]],
 ['Output width','width',[['Original',0],['640px',640],['480px',480],['320px',320],['240px',240]]],
 ['Colors','colors',[['256',256],['128',128],['64',64],['32',32],['16',16]]],
 ['Dithering','dither',[['Off',0],['Floyd–Steinberg',1]]],
 ['Palette quality','q',[['Best',1],['Good',4],['Fast',16]]]];
defs.forEach(([t,k,list])=>{
  const g=document.createElement('div');g.className='g';g.innerHTML='<p>'+t+'</p><div class="opts"></div>';
  const bs=[];const sync=()=>bs.forEach(([v,b])=>b.classList.toggle('on',v===st[k]));
  list.forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{st[k]=v;sync();info()};g.lastChild.appendChild(b);bs.push([v,b])});
  sync();$('groups').appendChild(g);
});
$('delay').oninput=e=>{st.delay=+e.target.value;$('dl').textContent=st.delay+' ms';document.querySelectorAll('.tw input').forEach(i=>i.placeholder=st.delay)};$('dl').textContent='100 ms';

/* crop presets */
const presets=[['Free',null],['Full','full'],['1:1',1],['16:9',16/9],['9:16',9/16],['4:3',4/3]];
let pbs=[];
presets.forEach(([l,r])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{
  if(r==='full'){crop={x:0,y:0,w:1,h:1};ratio=null}
  else if(r===null){ratio=null}
  else{ratio=r;let pw=BW,ph=BW/r;if(ph>BH){ph=BH;pw=BH*r}crop={w:pw/BW,h:ph/BH,x:(1-pw/BW)/2,y:(1-ph/BH)/2}}
  drawCrop()};$('presets').appendChild(b);pbs.push([r,b])});
function drawCrop(){
  const s=cropEl.style;s.left=crop.x*100+'%';s.top=crop.y*100+'%';s.width=crop.w*100+'%';s.height=crop.h*100+'%';
  pbs.forEach(([r,b])=>b.classList.toggle('on',r==='full'?(crop.w>.999&&crop.h>.999):r===ratio&&r!==null||(r===null&&ratio===null&&!(crop.w>.999&&crop.h>.999))));
  info();
}
function dims(){const cw=Math.max(1,Math.round(crop.w*BW)),ch=Math.max(1,Math.round(crop.h*BH));
  let ow=st.width?Math.min(st.width,cw):cw;return{cw,ch,ow,oh:Math.max(1,Math.round(ow*ch/cw))}}
function info(){const d=dims();$('info').textContent=d.cw+'×'+d.ch+' → '+d.ow+'×'+d.oh+' · '+imgs.length+' frame'+(imgs.length==1?'':'s')}
let drag=null;
const frac=ev=>{const r=stage.getBoundingClientRect();return[(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height]};
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));
cropEl.onpointerdown=ev=>{ev.stopPropagation();cropEl.setPointerCapture(ev.pointerId);const f=frac(ev);drag={m:ev.target.id==='hd'?'r':'m',fx:f[0],fy:f[1],c:{...crop}}};
cropEl.onpointermove=ev=>{if(!drag)return;const[fx,fy]=frac(ev);
  if(drag.m==='m'){crop.x=cl(drag.c.x+fx-drag.fx,0,1-crop.w);crop.y=cl(drag.c.y+fy-drag.fy,0,1-crop.h)}
  else{let w=cl(fx-crop.x,.03,1-crop.x),h;
    if(ratio){h=w*BW/ratio/BH;if(crop.y+h>1){h=1-crop.y;w=h*BH*ratio/BW}}else h=cl(fy-crop.y,.03,1-crop.y);
    crop.w=w;crop.h=h}
  drawCrop()};
cropEl.onpointerup=()=>{drag=null};

/* loading */
drop.onclick=()=>{file.value='';file.click()};
drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}};
$('another').onclick=()=>{if(!busy){file.value='';file.click()}};
['dragenter','dragover'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('over')}));
document.addEventListener('drop',e=>add([...e.dataTransfer.files]));
file.onchange=()=>add([...file.files]);
async function add(fs){
  fs=fs.filter(f=>f.type.startsWith('image/'));if(!fs.length||busy)return;
  fs.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  for(const f of fs){
    const url=URL.createObjectURL(f),img=new Image();img.src=url;
    try{await img.decode()}catch(_){msg.textContent='Couldn’t read '+f.name;URL.revokeObjectURL(url);continue}
    if(!imgs.length){const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));BW=Math.round(img.naturalWidth*s);BH=Math.round(img.naturalHeight*s);
      bc.width=pv.width=BW;bc.height=pv.height=BH;stage.style.aspectRatio=BW+'/'+BH;crop={x:0,y:0,w:1,h:1};ratio=null}
    imgs.push({url,img,delay:null})}
  refresh()}
function refresh(){
  drop.style.display=imgs.length?'none':'flex';cropEl.style.display=imgs.length?'block':'none';go.disabled=!imgs.length||busy;
  const t=$('thumbs');t.innerHTML='';
  imgs.forEach((m,i)=>{const d=document.createElement('div');d.className='th';d.innerHTML='<img src="'+m.url+'" alt=""><i>'+(i+1)+'</i><div><button title="Move left">◀</button><button title="Remove">✕</button><button title="Move right">▶</button></div>';
    const [l,x,r]=d.querySelectorAll('button');
    l.onclick=()=>{if(i>0){[imgs[i-1],imgs[i]]=[imgs[i],imgs[i-1]];refresh()}};
    r.onclick=()=>{if(i<imgs.length-1){[imgs[i+1],imgs[i]]=[imgs[i],imgs[i+1]];refresh()}};
    x.onclick=()=>{URL.revokeObjectURL(m.url);imgs.splice(i,1);refresh()};const w=document.createElement('div');w.className='tw';w.appendChild(d);
    const inp=document.createElement('input');inp.type='number';inp.min=20;inp.max=5000;inp.step=10;inp.placeholder=st.delay;inp.value=m.delay||'';inp.title='Delay for frame '+(i+1)+' in ms (blank = default)';inp.setAttribute('aria-label',inp.title);
    inp.oninput=()=>{const v=+inp.value;m.delay=inp.value&&v>=20?Math.min(5000,v):null};
    inp.onchange=()=>{inp.value=m.delay||''};
    w.appendChild(inp);t.appendChild(w)});
  drawCrop();
}
function paint(i){bx.fillStyle='#000';bx.fillRect(0,0,BW,BH);const im=imgs[i].img,s=Math.min(BW/im.naturalWidth,BH/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;
  bx.drawImage(im,(BW-w)/2,(BH-h)/2,w,h)}
function order(){const n=imgs.length,a=[...Array(n).keys()];
  if(st.dir===1)a.reverse();else if(st.dir===2)for(let i=n-2;i>0;i--)a.push(i);return a}

/* live preview */
function tick(now){
  if(imgs.length){const o=order();fi%=o.length;const cur=imgs[o[fi]];if(!last||now-last>=((cur&&cur.delay)||st.delay)){last=now;fi=(fi+1)%o.length;paint(o[fi]);pc.drawImage(bc,0,0)}}
  else pc.clearRect(0,0,pv.width,pv.height);
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);

/* export (encoding runs in a Web Worker so the page never lags) */
go.onclick=()=>{
  if(!imgs.length||busy)return;busy=true;go.disabled=true;$('res').style.display='none';$('bar').style.display='block';
  msg.textContent='Preparing frames…';
  const d=dims(),oc=document.createElement('canvas');oc.width=d.ow;oc.height=d.oh;const ox=oc.getContext('2d',{willReadFrequently:true});
  ox.imageSmoothingQuality='high';
  const frames=order().map(i=>{paint(i);ox.drawImage(bc,crop.x*BW,crop.y*BH,d.cw,d.ch,0,0,d.ow,d.oh);return ox.getImageData(0,0,d.ow,d.oh).data.buffer});
  const src=$('wk').textContent,wurl=URL.createObjectURL(new Blob([src],{type:'text/javascript'}));
  worker=new Worker(wurl);
  worker.onmessage=e=>{
    if(e.data.p!==undefined){$('bar').firstChild.style.width=e.data.p*100+'%';msg.textContent='Encoding… '+Math.round(e.data.p*100)+'%'}
    else{
      if(outUrl)URL.revokeObjectURL(outUrl);const blob=new Blob(e.data.done,{type:'image/gif'});outUrl=URL.createObjectURL(blob);
      $('out').src=outUrl;$('dlk').href=outUrl;$('sz').textContent=d.ow+'×'+d.oh+' · '+(blob.size/1048576>=1?(blob.size/1048576).toFixed(2)+' MB':Math.round(blob.size/1024)+' KB');
      $('res').style.display='block';msg.textContent='Done.';$('bar').style.display='none';fin()}};
  worker.onerror=err=>{msg.textContent='Couldn’t create the GIF: '+(err.message||'unknown error');$('bar').style.display='none';fin()};
  worker.postMessage({frames,w:d.ow,h:d.oh,delays:order().map(i=>imgs[i].delay||st.delay),loop:st.loop,colors:st.colors,dither:st.dither,q:st.q},frames);
  function fin(){URL.revokeObjectURL(wurl);worker.terminate();busy=false;go.disabled=!imgs.length}
};
drawCrop();
})();
</script>
</body>
</html>
